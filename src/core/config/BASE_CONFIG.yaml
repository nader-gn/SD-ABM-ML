    inflows:
    - births_total_year
    - migrations_total_year
    outflows:
    - baseline_deaths_total_year
    - deaths_total
  birth_rate_per_person_year:
    type: expression
    description: rate of birth per person
    units: 1/person/year
    category: social
    subcategory: demography
    usage: assumption
    region: city
    initial_value: 0.0
    expression: 0.015
