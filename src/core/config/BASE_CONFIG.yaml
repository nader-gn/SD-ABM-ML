  traffic_plan_revenue_IRR_year_obs:
    type: input
    description: annual revenue from traffic plan charges (real/base-year IRR)
    units: IRR/year
    category: economic
    subcategory: policy_revenue
    region: region 12
    subregion: traffic-plan area
    usage: data
    initial_value: 0.0
  traffic_plan_revenue_scale:
    type: expression
    description: Scale factor to map fee×TFP trips to observed traffic plan revenue in 2023
    units: ratio
    expression: '1.0'
    category: economic
    subcategory: regulatory_revenue
    region: city
  traffic_plan_revenue_IRR_year:
    type: expression
    description: Traffic plan revenue (observed in history; fee×TFP trips in projection)
    units: IRR/year
    expression: traffic_plan_revenue_IRR_year_obs if YEAR_GRG <= 2023 else (traffic_plan_fee_IRR_trip * trips_car_city_tfp
      * traffic_plan_revenue_scale)
    dependencies:
    - traffic_plan_revenue_IRR_year_obs
    - traffic_plan_fee_IRR_trip
    - trips_car_city_tfp
    - traffic_plan_revenue_scale
    category: economic
    subcategory: regulatory_revenue
    region: city
  traffic_plan_fee_multiplier:
    type: input
    description: Policy multiplier for traffic plan fee (level, not compounded)
    units: ratio
    category: policy
    subcategory: pricing
    region: city
    initial_value: 1.0
    bounds:
    - 0.5
    - 3.0
  fuel_price_multiplier:
    type: input
    description: Policy multiplier for gasoline price (level, not compounded)
    units: ratio
    category: policy
    subcategory: pricing
    region: city
    initial_value: 1.0
    bounds:
    - 0.5
    - 5.0
  r12_voc_multiplier:
    type: input
    description: Calibration multiplier to scale v/c in Region 12.
    units: Dimensionless
    category: transport
    subcategory: congestion
    region: region 12
    usage: calibration
    initial_value: 3.1163515688121226
    bounds:
    - 0.5
    - 8.0
  v_over_c_r12_eff:
    type: expression
    description: Effective v/c in R12 after applying calibration multiplier.
    units: Dimensionless
    category: transport
    subcategory: congestion
    region: region 12
    dependencies:
    - v_over_c_r12
    - r12_voc_multiplier
    expression: v_over_c_r12 * r12_voc_multiplier
    bounds:
    - 0.0
    - 10.0
  spd_car_r12:
    type: expression
    description: Private car speed in R12.
    units: km/h
    category: transport
    subcategory: performance
    region: region 12
    dependencies:
    - alpha_congestion_speed
    - congestion_index_r12
    - spd_car_freeflow_r12
    expression: spd_car_freeflow_r12 / (1.0 + 1.0 * alpha_congestion_speed * congestion_index_r12)
    bounds:
    - 1.0
    - 120.0
  spd_tax_r12:
    type: expression
    description: Taxi speed in R12.
    units: km/h
    category: transport
    subcategory: performance
    region: region 12
    dependencies:
    - alpha_congestion_speed
    - congestion_index_r12
    - spd_tax_freeflow_r12
    expression: spd_tax_freeflow_r12 / (1.0 + 1.0 * alpha_congestion_speed * congestion_index_r12)
    bounds:
    - 1.0
    - 120.0
  spd_oth_r12:
    type: expression
    description: Other vehicle speed in R12.
    units: km/h
    category: transport
    subcategory: performance
    region: region 12
    dependencies:
    - alpha_congestion_speed
    - congestion_index_r12
    - spd_oth_freeflow_r12
    expression: spd_oth_freeflow_r12 / (1.0 + 1.0 * alpha_congestion_speed * congestion_index_r12)
    bounds:
    - 1.0
    - 120.0
  spd_mot_r12:
    type: expression
    description: Motorcycle speed in R12.
    units: km/h
    category: transport
    subcategory: performance
    region: region 12
    dependencies:
    - spd_mot_history_calibration_factor
    - spd_mot_freeflow_r12
    - alpha_congestion_speed
    - congestion_index_r12
    expression: spd_mot_history_calibration_factor * spd_mot_freeflow_r12 / (1.0 + 0.7 * alpha_congestion_speed * congestion_index_r12)
    bounds:
    - 1.0
    - 120.0
  spd_bus_r12:
    type: expression
    description: Bus speed in R12.
    units: km/h
    category: transport
    subcategory: performance
    region: region 12
    dependencies:
    - alpha_congestion_speed
    - congestion_index_r12
    - spd_bus_freeflow_r12
    expression: spd_bus_freeflow_r12 / (1.0 + 1.2 * alpha_congestion_speed * congestion_index_r12)
    bounds:
    - 1.0
    - 120.0
  travel_time_tax_r12_base_hours:
    type: expression
    description: Taxi travel time base in R12.
    units: hours
    category: transport
    subcategory: performance
    region: region 12
    dependencies:
    - trip_length_r12_km
    - spd_tax_r12
    expression: trip_length_r12_km / max(spd_tax_r12, 1.0)
    bounds:
    - 0.01
    - 10.0
  travel_time_oth_r12_base_hours:
    type: expression
    description: Other vehicle travel time base in R12.
    units: hours
    category: transport
    subcategory: performance
    region: region 12
    dependencies:
    - trip_length_r12_km
    - spd_oth_r12
    expression: trip_length_r12_km / max(spd_oth_r12, 1.0)
    bounds:
    - 0.01
    - 10.0
  travel_time_mot_r12_base_hours:
    type: expression
    description: Motorcycle travel time base in R12.
    units: hours
    category: transport
    subcategory: performance
    region: region 12
    dependencies:
    - trip_length_r12_km
    - spd_mot_r12
    expression: trip_length_r12_km / max(spd_mot_r12, 1.0)
    bounds:
    - 0.01
    - 10.0
  travel_time_bus_r12_hours:
    type: expression
    description: Bus travel time in R12.
    units: hours
    category: transport
    subcategory: performance
    region: region 12
    dependencies:
    - trip_length_r12_km
    - spd_bus_r12
    expression: trip_length_r12_km / max(spd_bus_r12, 1.0)
    bounds:
    - 0.01
    - 10.0
  gasoline_L_year_r12:
    type: expression
    description: gasoline consumption in R12
    units: litre/year
    category: environment
    subcategory: energy_use
    region: region 12
    initial_value: 0.0
    expression: vkm_car_r12 * car_energy_closure_factor * fc_car_gasoline_litre_km * max(1 - share_car_EV - share_car_CNG,
      0) + vkm_taxi_r12 * fc_taxi_gasoline_litre_km * max(1 - share_taxi_EV - share_taxi_CNG, 0) + vkm_motorcycle_r12 * fc_motorcycle_gasoline_litre_km
      * max(1 - share_motorcycle_EV, 0)
  diesel_L_year_r12:
    type: expression
    description: diesel consumption in R12 (bus)
    units: litre/year
    category: environment
    subcategory: energy_use
    region: region 12
    initial_value: 0.0
    expression: vkm_bus_r12 * fc_bus_diesel_litre_km * max(1 - share_bus_EV, 0)
  cng_kg_year_r12:
    type: expression
    description: CNG consumption in R12 (car+taxi)
    units: kg/year
    category: environment
    subcategory: energy_use
    region: region 12
    initial_value: 0.0
    expression: vkm_car_r12 * car_energy_closure_factor * share_car_CNG * fc_car_CNG_kg_km + vkm_taxi_r12 * share_taxi_CNG
      * fc_taxi_CNG_kg_km
  electricity_kWh_year_r12:
    type: expression
    description: transport electricity use in R12
    units: kWh/year
    category: environment
    subcategory: energy_use
    region: region 12
    initial_value: 0.0
    expression: vkm_car_r12 * car_energy_closure_factor * share_car_EV * energy_car_EV_kWh_km + vkm_taxi_r12 * share_taxi_EV
      * energy_taxi_EV_kWh_km + vkm_bus_r12 * share_bus_EV * energy_bus_EV_kWh_km + vkm_motorcycle_r12 * share_motorcycle_EV
      * energy_motorcycle_EV_kWh_km + vkm_metro_r12 * energy_metro_kWh_km
  CO2_t_year_r12:
    type: expression
    description: CO2 emissions in R12 (tailpipe + grid)
    units: t/year
    category: environment
    subcategory: emissions
    region: region 12
    initial_value: 0.0
    expression: (gasoline_L_year_r12 * EF_CO2_gasoline_kg_litre + diesel_L_year_r12 * EF_CO2_diesel_kg_litre + cng_kg_year_r12
      * EF_CO2_CNG_kg_kg + electricity_kWh_year_r12 * EF_CO2_grid_kg_kWh) / 1000
  NOx_t_year_r12:
    type: expression
    description: Direct Region 12 NOx emissions from district modal VKT, technology shares, emission factors, and grid electricity
    units: t/year
    category: environment
    subcategory: emissions
    region: region 12
    initial_value: 0.0
    expression: (EF_NOx_car_g_km * vkm_car_r12 * car_energy_closure_factor * (1 - share_car_EV) + EF_NOx_bus_g_km * vkm_bus_r12
      * (1 - share_bus_EV) + EF_NOx_taxi_g_km * vkm_taxi_r12 * (1 - share_taxi_EV) + EF_NOx_motorcycle_g_km * vkm_motorcycle_r12
      * (1 - share_motorcycle_EV) + EF_grid_NOx_g_kWh * electricity_kWh_year_r12) / 1e6
  final_energy_MJ_year_r12:
    type: expression
    description: final energy in R12
    units: MJ/year
    category: environment
    subcategory: energy_use
    region: region 12
    initial_value: 0.0
    expression: gasoline_L_year_r12 * LHV_gasoline_MJ_litre + diesel_L_year_r12 * LHV_diesel_MJ_litre + cng_kg_year_r12 *
      LHV_CNG_MJ_kg + electricity_kWh_year_r12 * LHV_electricity_MJ_kWh
  cost_energy_IRR_year_r12:
    type: expression
    description: energy cost in R12
    units: IRR/year
    category: economic
    subcategory: opex
    region: region 12
    initial_value: 0.0
    expression: gasoline_L_year_r12 * fuel_price_gasoline_IRR_litre + diesel_L_year_r12 * fuel_price_diesel_IRR_litre + cng_kg_year_r12
      * fuel_price_CNG_IRR_kg + electricity_kWh_year_r12 * electricity_price_transport_indexed_IRR_kWh
  cost_climate_IRR_year_r12:
    type: expression
    description: climate damage cost in R12
    units: IRR/year
    category: impact
    subcategory: external_costs
    region: region 12
    initial_value: 0.0
    expression: CO2_t_year_r12 * cost_of_carbon_IRR_t
  GDP_city_obs:
    type: input
    description: Observed GDP (hindcast)
    units: IRR/year
    category: economic
