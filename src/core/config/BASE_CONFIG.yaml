  travel_time_bus_hours:
    type: expression
    description: time of travel by bus
    units: hours/trip
    category: transport
    subcategory: travel_time
    region: city
    initial_value: 0.0
    expression: trip_length_km / max(spd_bus, 1.0)
  travel_time_car_congested_hours:
    type: expression
    description: time of travel by car including citywide delay share
    units: hours/trip
    category: transport
    subcategory: travel_time
    region: city
    initial_value: 0.0
    expression: travel_time_car_hours * (1 + dly_tot)
  travel_time_car_hours:
    type: expression
    description: time of travel by car
    units: hours/trip
    category: transport
    subcategory: travel_time
    region: city
    initial_value: 0.0
    expression: trip_length_km / max(spd_car, 1.0)
  travel_time_car_r12_base_hours:
    type: expression
    description: Car travel time base in R12.
    units: hours
    category: transport
    subcategory: performance
    region: region 12
    dependencies:
    - trip_length_r12_km
    - spd_car_r12
    expression: trip_length_r12_km / max(spd_car_r12, 1.0)
    bounds:
    - 0.01
    - 10.0
  travel_time_car_r12_hours:
    type: expression
    description: time of travel by car
    units: hours/trip
    category: transport
    subcategory: travel_time
    region: region 12
    initial_value: 0.0
    expression: travel_time_car_r12_base_hours * (1 + dly_r12)
  travel_time_metro_hours:
    type: expression
    description: time of travel by metro
    units: hours/trip
    category: transport
    subcategory: travel_time
    region: city
    initial_value: 0.0
    expression: trip_length_metro_km / max(spd_met, 1.0)
  travel_time_motorcycle_hours:
