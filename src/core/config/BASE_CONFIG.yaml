    subcategory: green_public_space
    region: region 12
    initial_value: 0.0
    expression: green_parks_area_r12 + green_streets_area_r12
  green_space_mitigation_factor_NO2:
    type: expression
    description: mitigation factor for reducing NO₂ concentrations by green space
    units: Dimensionless
    category: environment
    subcategory: air_quality
    region: city
    initial_value: 0.0
    expression: max(green_mitigation_floor, 1 - alpha_green_NO2 * min(green_space_share_of_urban_area, green_space_share_cap))
  green_space_mitigation_factor_PM25:
    type: expression
    description: mitigation factor for reducing PM₂.₅ concentrations by green space
    units: Dimensionless
    category: environment
    subcategory: air_quality
    region: city
    initial_value: 0.0
    expression: max(0.5, 1 - alpha_green_PM25 * min(green_space_share_of_urban_area, 0.4))
  green_space_per_capita_m2:
    type: expression
    description: area of public green space (parks + streets) per capita
    units: m²/person
    category: urban
    subcategory: green_public_space
    region: city
    initial_value: 0.0
    expression: green_space_area_m2 / max(population_city, 1)
  green_space_per_capita_r12_m2:
    type: expression
    description: area of public green space (parks + streets) per capita
    units: m²/person
    category: urban
    subcategory: green_public_space
    region: region 12
