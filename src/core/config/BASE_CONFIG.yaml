    initial_value: 0.0
  cost_noise_IRR_year:
    type: expression
    description: cost of noise exposure (scaled by noise index)
    units: IRR/year
    category: impact
    subcategory: external_costs
    region: city
    initial_value: 0.0
    expression: noise_base_cost_IRR_year * noise_exposure_index
