    region: city
    initial_value: 0.0
    expression: (modal_share_other_ml*adj_factor_other_policy)/max(policy_norm_denom_city, 1e-12)
    dependencies:
    - modal_share_other_ml
    - adj_factor_other_policy
    - policy_norm_denom_city
  adj_factor_car_policy_r12:
    type: expression
    description: Multiplicative policy adjustment for car share (r12)
    units: '-'
    category: policy
    subcategory: adjustment
    region: region 12
    initial_value: 1.0
    expression: (0.9618) * (exp(-coef_k_fee*(traffic_plan_fee_multiplier/traffic_plan_fee_multiplier_base - 1.0) - 0.85*coef_k_park*(parking_supply_multiplier_r12_base/max(parking_supply_multiplier_r12,
      1e-6) - 1.0) - 0.35*coef_k_commute*(commute_management_multiplier/commute_management_multiplier_base - 1.0)) if YEAR_GRG>=2024
      else 1.0)
  adj_factor_bus_policy_r12:
    type: expression
    description: Multiplicative policy adjustment for bus share (r12)
    units: '-'
    category: policy
    subcategory: adjustment
    region: region 12
    initial_value: 1.0
    expression: (1.0197) * (exp(-coef_k_fare*(bus_fare_rate/bus_fare_rate_base - 1.0) + coef_k_speed*(spd_bus_freeflow/spd_bus_freeflow_base
      - 1.0) + 0.15*coef_k_commute*(commute_management_multiplier/commute_management_multiplier_base - 1.0)) if YEAR_GRG>=2024
      else 1.0)
  adj_factor_metro_policy_r12:
    type: expression
    description: Multiplicative policy adjustment for metro share (r12)
    units: '-'
    category: policy
    subcategory: adjustment
    region: region 12
    initial_value: 1.0
    expression: (1.0608) * (exp(-coef_k_fare*(metro_fare_rate/metro_fare_rate_base - 1.0) + coef_k_speed*(spd_met/spd_met_base
      - 1.0) + 0.18*coef_k_commute*(commute_management_multiplier/commute_management_multiplier_base - 1.0)) if YEAR_GRG>=2024
      else 1.0)
  adj_factor_tax_policy_r12:
    type: expression
    description: Neutral policy adjustment for tax share (r12)
    units: '-'
    category: policy
    subcategory: adjustment
    region: region 12
    initial_value: 1.0
    expression: (0.976) * (exp(-0.6*coef_k_fee*(traffic_plan_fee_multiplier/traffic_plan_fee_multiplier_base - 1.0) - 0.15*coef_k_park*(parking_supply_multiplier_r12_base/max(parking_supply_multiplier_r12,
      1e-6) - 1.0) - 0.05*coef_k_commute*(commute_management_multiplier/commute_management_multiplier_base - 1.0)) if YEAR_GRG>=2024
      else 1.0)
  adj_factor_mot_policy_r12:
    type: expression
    description: Neutral policy adjustment for mot share (r12)
    units: '-'
    category: policy
    subcategory: adjustment
    region: region 12
    initial_value: 1.0
    expression: (0.9617) * (exp(-0.8*coef_k_fuel*(fuel_price_multiplier/fuel_price_multiplier_base - 1.0) - 0.12*coef_k_commute*(commute_management_multiplier/commute_management_multiplier_base
      - 1.0)) if YEAR_GRG>=2024 else 1.0)
  adj_factor_oth_policy_r12:
    type: expression
    description: Neutral policy adjustment for oth share (r12)
    units: '-'
    category: policy
    subcategory: adjustment
    region: region 12
    initial_value: 1.0
    expression: (1.024) * (exp(0.08*coef_k_commute*(commute_management_multiplier/commute_management_multiplier_base - 1.0))
      if YEAR_GRG>=2024 else 1.0)
  policy_norm_denom_r12:
    type: expression
    description: Denominator for policy-adjusted motorized modal shares (r12)
    units: '-'
    category: policy
    subcategory: adjustment
    region: region 12
    initial_value: 1.0
    expression: (modal_share_car_r12_ml*adj_factor_car_policy_r12 + modal_share_bus_r12_ml*adj_factor_bus_policy_r12 + modal_share_met_r12_ml*adj_factor_metro_policy_r12
      + modal_share_tax_r12_ml*adj_factor_tax_policy_r12 + modal_share_mot_r12_ml*adj_factor_mot_policy_r12 + modal_share_oth_r12_ml*adj_factor_oth_policy_r12)
  modal_share_car_r12_adj:
    type: expression
    description: Policy-adjusted car share (r12)
    units: share
    category: transport
    subcategory: mode_share
    region: region 12
    initial_value: 0.0
    expression: (modal_share_car_r12_ml*adj_factor_car_policy_r12)/max(policy_norm_denom_r12, 1e-12)
    dependencies:
    - modal_share_car_r12_ml
    - adj_factor_car_policy_r12
    - policy_norm_denom_r12
  modal_share_bus_r12_adj:
    type: expression
    description: Policy-adjusted bus share (r12)
    units: share
    category: transport
    subcategory: mode_share
    region: region 12
    initial_value: 0.0
    expression: (modal_share_bus_r12_ml*adj_factor_bus_policy_r12)/max(policy_norm_denom_r12, 1e-12)
    dependencies:
    - modal_share_bus_r12_ml
    - adj_factor_bus_policy_r12
    - policy_norm_denom_r12
  modal_share_met_r12_adj:
    type: expression
    description: Policy-adjusted metro share (r12)
    units: share
    category: transport
    subcategory: mode_share
    region: region 12
    initial_value: 0.0
    expression: (modal_share_met_r12_ml*adj_factor_metro_policy_r12)/max(policy_norm_denom_r12, 1e-12)
    dependencies:
    - modal_share_met_r12_ml
    - adj_factor_metro_policy_r12
    - policy_norm_denom_r12
  modal_share_tax_r12_adj:
    type: expression
    description: Policy-adjusted taxi share (r12)
    units: share
    category: transport
    subcategory: mode_share
    region: region 12
    initial_value: 0.0
    expression: (modal_share_tax_r12_ml*adj_factor_tax_policy_r12)/max(policy_norm_denom_r12, 1e-12)
    dependencies:
    - modal_share_tax_r12_ml
    - adj_factor_tax_policy_r12
    - policy_norm_denom_r12
  modal_share_mot_r12_adj:
    type: expression
    description: Policy-adjusted motorcycle share (r12)
    units: share
    category: transport
    subcategory: mode_share
    region: region 12
    initial_value: 0.0
    expression: (modal_share_mot_r12_ml*adj_factor_mot_policy_r12)/max(policy_norm_denom_r12, 1e-12)
    dependencies:
    - modal_share_mot_r12_ml
    - adj_factor_mot_policy_r12
    - policy_norm_denom_r12
  modal_share_oth_r12_adj:
    type: expression
    description: Policy-adjusted other share (r12)
    units: share
    category: transport
    subcategory: mode_share
    region: region 12
    initial_value: 0.0
    expression: (modal_share_oth_r12_ml*adj_factor_oth_policy_r12)/max(policy_norm_denom_r12, 1e-12)
    dependencies:
    - modal_share_oth_r12_ml
    - adj_factor_oth_policy_r12
    - policy_norm_denom_r12
  trp_tps_city_effective:
    type: expression
    description: Effective total city trips (observed/forecast) after telework demand multiplier
    units: Trips/year
    category: transport
    subcategory: travel_demand
    region: city
    initial_value: 0.0
    expression: trp_tps_city * telework_trip_multiplier
    dependencies:
    - trp_tps_city
    - telework_trip_multiplier
  trp_r12_effective:
    type: expression
    description: Effective total trips in Region12 after telework demand multiplier
    units: Trips/year
    category: transport
    subcategory: travel_demand
    region: region 12
    initial_value: 0.0
    expression: trp_r12 * telework_trip_multiplier
    dependencies:
    - trp_r12
    - telework_trip_multiplier
  car_energy_closure_factor:
    type: input
    description: Calibration factor linking modeled mobility VKT to effective energy/emissions VKT for private cars
    units: '-'
    category: environment
    subcategory: energy_use
    region: city
    initial_value: 1.3808737260621238
    column: car_energy_closure_factor_histcal
  traffic_plan_revenue_earmark_share_transport:
    type: input
    description: Central share of collected traffic-plan/access revenue recycled into the transport improvement budget; uncertainty
      is handled in decision-layer sensitivity.
    units: –
    category: economic
    subcategory: public_transport_finance
    region: city
    initial_value: 0.4
  region12_municipal_budget_share_of_tehran:
    type: input
    description: Observed/proxy municipal-budget share used as the default Region 12 budgetary allocation factor; activity
      and revenue attribution are handled separately.
    units: –
    category: economic
    subcategory: macro
    region: region 12
    initial_value: 0.0079
  municipal_budget_IRR_year_r12_proxy:
    type: expression
    description: Region 12 proxy municipal budget as fixed share of Tehran municipal budget
    units: IRR/year
    category: economic
    subcategory: macro
    region: region 12
    initial_value: 0.0
    expression: municipal_budget_IRR_year * region12_municipal_budget_share_of_tehran
    dependencies:
    - municipal_budget_IRR_year
    - region12_municipal_budget_share_of_tehran
  transport_budget_effective_IRR_year:
    type: expression
    description: Effective transport budget including collected and earmarked traffic-plan revenue.
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: city
    initial_value: 0.0
    expression: transport_budget_IRR_year + traffic_plan_revenue_earmark_share_transport * traffic_plan_revenue_collection_factor
      * traffic_plan_revenue_IRR_year
    dependencies:
    - transport_budget_IRR_year
    - traffic_plan_revenue_earmark_share_transport
    - traffic_plan_revenue_collection_factor
    - traffic_plan_revenue_IRR_year
  transport_budget_IRR_year_r12_alloc:
    type: expression
    description: Region 12 budgetary transport-budget proxy based on its observed/proxy municipal-budget share, not on traffic-plan
      activity intensity.
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: transport_budget_IRR_year * region12_municipal_budget_share_of_tehran
    dependencies:
    - transport_budget_IRR_year
    - region12_municipal_budget_share_of_tehran
  traffic_plan_revenue_IRR_year_r12_alloc:
    type: expression
    description: Region 12 attributed traffic-plan revenue based on TFP-entry concentration; retained with the existing _alloc
      name for configuration compatibility.
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: traffic_plan_revenue_IRR_year * region12_traffic_plan_revenue_attribution_share
    dependencies:
    - traffic_plan_revenue_IRR_year
    - region12_traffic_plan_revenue_attribution_share
  transport_budget_effective_IRR_year_r12_alloc:
    type: expression
    description: Region 12 effective transport budget including attributed, collected, and earmarked traffic-plan revenue.
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: transport_budget_IRR_year_r12_alloc + traffic_plan_revenue_earmark_share_transport * traffic_plan_revenue_collection_factor
      * traffic_plan_revenue_IRR_year_r12_alloc
    dependencies:
    - transport_budget_IRR_year_r12_alloc
    - traffic_plan_revenue_earmark_share_transport
    - traffic_plan_revenue_collection_factor
    - traffic_plan_revenue_IRR_year_r12_alloc
  CAPEX_transport_affordable_IRR_year_r12_alloc:
    type: expression
    description: Region 12 affordable annualized transport investment budget including attributed, collected, and earmarked
      traffic-plan revenue.
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: transport_budget_IRR_year_r12_alloc * public_investment_rate_transport + traffic_plan_revenue_earmark_share_transport
      * traffic_plan_revenue_collection_factor * traffic_plan_revenue_IRR_year_r12_alloc
    dependencies:
    - transport_budget_IRR_year_r12_alloc
    - public_investment_rate_transport
    - traffic_plan_revenue_earmark_share_transport
    - traffic_plan_revenue_collection_factor
    - traffic_plan_revenue_IRR_year_r12_alloc
  revenue_transport_public_IRR_year_r12_alloc:
    type: expression
    description: Region 12 PT fare revenue from direct bus and metro trips.
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: fare_bus_IRR_trip_indexed * trp_r12_effective * modal_share_bus_r12 + fare_metro_IRR_trip_indexed * trp_r12_effective
      * modal_share_met_r12
    dependencies:
    - fare_bus_IRR_trip_indexed
    - fare_metro_IRR_trip_indexed
    - trp_r12_effective
    - modal_share_bus_r12
    - modal_share_met_r12
  OPEX_PT_IRR_year_r12_alloc:
    type: expression
    description: Region 12 PT operating expenditure from local service and energy proxy.
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: vkm_bus_r12 * opex_bus_IRR_km_indexed + (vkm_BRT * (len_brt_r12 / max(len_brt,1e-9))) * opex_BRT_IRR_km_indexed
      + vkm_metro_r12 * opex_metro_IRR_km_indexed + cost_energy_PT_IRR_year * min(max(0.5 * (PT_trips_total_r12 / max(PT_trips_total,1e-9))
      + 0.5 * ((vkm_bus_r12 + vkm_metro_r12 + vkm_BRT * (len_brt_r12 / max(len_brt,1e-9))) / max(vkm_bus + vkm_metro + vkm_BRT,1e-9)),
      0.05), 0.25)
    dependencies:
    - vkm_bus_r12
    - opex_bus_IRR_km_indexed
    - vkm_BRT
    - len_brt_r12
    - len_brt
    - opex_BRT_IRR_km_indexed
    - vkm_metro_r12
    - opex_metro_IRR_km_indexed
    - cost_energy_PT_IRR_year
    - PT_trips_total_r12
    - PT_trips_total
    - vkm_bus
    - vkm_metro
    - vkm_BRT
  OPEX_PT_deficit_IRR_year_r12_alloc:
    type: expression
    description: Region 12 nonnegative PT operating deficit
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: max(OPEX_PT_IRR_year_r12_alloc - revenue_transport_public_IRR_year_r12_alloc, 0)
    dependencies:
    - OPEX_PT_IRR_year_r12_alloc
    - revenue_transport_public_IRR_year_r12_alloc
  farebox_recovery_PT:
    type: expression
    description: PT farebox recovery ratio
    units: –
    category: economic
    subcategory: public_transport_finance
    region: city
    initial_value: 0.0
    expression: revenue_transport_public_IRR_year / max(OPEX_PT_IRR_year, 1e-9)
    dependencies:
    - revenue_transport_public_IRR_year
    - OPEX_PT_IRR_year
  farebox_recovery_PT_r12_alloc:
    type: expression
    description: Region 12 PT farebox recovery ratio
    units: –
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: revenue_transport_public_IRR_year_r12_alloc / max(OPEX_PT_IRR_year_r12_alloc, 1e-9)
    dependencies:
    - revenue_transport_public_IRR_year_r12_alloc
    - OPEX_PT_IRR_year_r12_alloc
  transport_budget_revenue_share_effective:
    type: expression
    description: Share of effective transport budget coming from collected and earmarked traffic-plan revenue.
    units: –
    category: economic
    subcategory: public_transport_finance
    region: city
    initial_value: 0.0
    expression: traffic_plan_revenue_earmark_share_transport * traffic_plan_revenue_collection_factor * traffic_plan_revenue_IRR_year
      / max(transport_budget_effective_IRR_year, 1e-9)
    dependencies:
    - traffic_plan_revenue_earmark_share_transport
    - traffic_plan_revenue_collection_factor
    - traffic_plan_revenue_IRR_year
    - transport_budget_effective_IRR_year
  transport_budget_revenue_share_effective_r12_alloc:
    type: expression
    description: Region 12 share of effective transport budget coming from attributed, collected, and earmarked traffic-plan
      revenue.
    units: –
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: traffic_plan_revenue_earmark_share_transport * traffic_plan_revenue_collection_factor * traffic_plan_revenue_IRR_year_r12_alloc
      / max(transport_budget_effective_IRR_year_r12_alloc, 1e-9)
    dependencies:
    - traffic_plan_revenue_earmark_share_transport
    - traffic_plan_revenue_collection_factor
    - traffic_plan_revenue_IRR_year_r12_alloc
    - transport_budget_effective_IRR_year_r12_alloc
  cost_transport_public_IRR_year_r12_alloc:
    type: expression
    description: Region 12 allocated public transport system cost
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: OPEX_PT_IRR_year_r12_alloc + CAPEX_transport_affordable_IRR_year_r12_alloc
    dependencies:
    - OPEX_PT_IRR_year_r12_alloc
    - CAPEX_transport_affordable_IRR_year_r12_alloc
  pt_cost_to_effective_budget_ratio:
    type: expression
    description: public transport cost to effective transport budget ratio
    units: –
    category: economic
    subcategory: public_transport_finance
    region: city
    initial_value: 0.0
    expression: cost_transport_public_IRR_year / max(transport_budget_effective_IRR_year, 1e-9)
    dependencies:
    - cost_transport_public_IRR_year
    - transport_budget_effective_IRR_year
  pt_cost_to_effective_budget_ratio_r12_alloc:
    type: expression
    description: Region 12 public transport cost to effective transport budget ratio
    units: –
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: cost_transport_public_IRR_year_r12_alloc / max(transport_budget_effective_IRR_year_r12_alloc, 1e-9)
    dependencies:
    - cost_transport_public_IRR_year_r12_alloc
    - transport_budget_effective_IRR_year_r12_alloc
  commute_management_multiplier:
    type: input
    description: Policy intensity multiplier for demand-smoothing / flex-time effects on private-mode attractiveness
    units: ratio
    category: policy
    subcategory: demand_management
    region: city
    initial_value: 1.0
    bounds:
    - 0.9
    - 1.5
  commute_management_multiplier_base:
    type: input
    description: baseline reference for commute_management_multiplier
    units: '-'
    category: policy_ref
    subcategory: baseline
    region: city
    initial_value: 1.0
  coef_k_commute:
    type: input
    description: policy adjustment coefficient k_commute for demand-smoothing spillovers into modal substitution
    units: '-'
    category: policy_ref
    subcategory: coeff
    region: city
    initial_value: 0.22
    bounds:
    - 0.0
    - 2.0
  parking_supply_multiplier_r12:
    type: input
    description: Policy multiplier on Region 12 parking supply / curb availability (level, not compounded)
    units: ratio
    category: policy
    subcategory: parking
    region: region 12
    initial_value: 1.0
    bounds:
    - 0.6
    - 1.1
  parking_supply_multiplier_r12_base:
    type: input
    description: baseline reference for parking_supply_multiplier_r12_base
    units: '-'
    category: policy_ref
    subcategory: baseline
    region: region 12
    initial_value: 1.0
  coef_k_park:
    type: input
    description: policy adjustment coefficient k_park for core parking-management pressure
    units: '-'
    category: policy_ref
    subcategory: coeff
    region: region 12
    initial_value: 0.45
    bounds:
    - 0.0
    - 2.0
  spd_car_history_calibration_factor:
    type: input
    description: Multiplicative calibration factor for Tehran car speed, retained in both hindcast and projection to carry
      the historically anchored service-speed regime into scenario simulation.
    units: Dimensionless
    category: transport
    subcategory: calibration
    region: city
    usage: calibration
    initial_value: 1.0
    bounds:
    - 0.5
    - 1.5
  spd_bus_history_calibration_factor:
    type: input
    description: Multiplicative calibration factor for Tehran bus speed, retained in both hindcast and projection to carry
      the historically anchored service-speed regime into scenario simulation.
    units: Dimensionless
    category: transport
    subcategory: calibration
    region: city
    usage: calibration
    initial_value: 1.0
    bounds:
    - 0.5
    - 1.5
  traffic_plan_revenue_collection_factor:
    type: input
    description: Central collection/realization factor applied to traffic-plan/access revenue before earmarking; used to separate
      gross revenue from usable budgetary inflow.
    units: –
    category: economic
    subcategory: public_transport_finance
    region: city
    initial_value: 0.9
  region12_traffic_plan_revenue_attribution_share:
    type: input
    description: Region 12 attributed share of traffic-plan revenue based on observed TFP-entry concentration; this is a revenue
      attribution factor, not a transport-budget allocation factor.
    units: –
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.45661004704854624
  fare_bus_observed_IRR_trip:
    type: input
    description: Observed subsidized passenger fare per bus trip used for leakage-safe historical fare accounting.
    units: IRR/trip
