  opex_BRT_IRR_km_base:
    type: input
    description: operating cost of BRT buses (ICE) per km
    units: IRR/km
    category: economic
    subcategory: opex
    region: city
    initial_value: 30000.0
  opex_BRT_EV_IRR_km_base:
    type: input
    description: operating cost of BRT buses (EV) per km
    units: IRR/km
    category: economic
    subcategory: opex
    region: city
    initial_value: 40000.0
  opex_BRT_IRR_km_indexed:
    type: expression
    description: operating cost of BRT buses per km (inflation-adjusted)
    units: IRR/km
    category: economic
    subcategory: opex
    region: city
    initial_value: 0.0
    expression: ( share_brt_bus_diesel * opex_BRT_IRR_km_base + share_brt_bus_EV * opex_BRT_EV_IRR_km_base) * cost_index_50
  opex_bus_EV_IRR_km_base:
    type: input
    description: operating cost of buses (EV) per km
    units: IRR/km
    category: economic
    subcategory: opex
    region: city
    initial_value: 28000.0
  opex_bus_IRR_km_base:
    type: input
    description: operating cost of buses (ICE) per km
    units: IRR/km
    category: economic
    subcategory: opex
    region: city
    initial_value: 32000.0
  opex_bus_IRR_km_indexed:
    type: expression
    description: operating cost of buses per km (ICE-EV; inflation-adjusted)
    units: IRR/km
    category: economic
    subcategory: opex
    region: city
    initial_value: 0.0
    expression: ( share_bus_diesel * opex_bus_IRR_km_base + share_bus_EV * opex_bus_EV_IRR_km_base) * cost_index_50
  opex_car_EV_IRR_km_base:
    type: input
    description: operating cost of cars (EV) per km
    units: IRR/km
    category: economic
    subcategory: opex
    region: city
    initial_value: 1500
  opex_car_IRR_km_indexed:
    type: expression
    description: operating cost of cars (ICE-EV) per km (inflation-adjusted)
    units: IRR/km
    category: economic
    subcategory: opex
    region: city
    initial_value: 0.0
    expression: (  (1 - share_car_EV) * opex_car_IRR_km_base +   share_car_EV * opex_car_EV_IRR_km_base) * (cost_index_50)
  opex_car_IRR_km_base:
    type: input
    description: operating cost of cars per km (maintenance, tyres, etc.)
    units: IRR/km
    category: economic
    subcategory: opex
    region: city
    initial_value: 1300
  opex_metro_IRR_km_indexed:
    type: expression
    description: operating cost of metro per metro-vehicle-km (inflation-adjusted);
    units: IRR/vehicle-km
    category: economic
    subcategory: opex
    region: city
    initial_value: 0.0
    expression: opex_metro_IRR_km_base * cost_index_50
  opex_metro_IRR_km_base:
    type: input
    description: operating cost of metro per metro-vehicle-km (car-km)
    units: IRR/vehicle-km
    category: economic
    subcategory: opex
    region: city
    initial_value: 120000.0
  opex_taxi_EV_IRR_km_base:
    type: input
    description: operating cost of taxis (EV) per km
    units: IRR/km
    category: economic
    subcategory: opex
    region: city
    initial_value: 1800
  opex_taxi_IRR_km_indexed:
    type: expression
    description: operating cost of taxis per km (ICE-EV; inflation-adjusted)
    units: IRR/km
    category: economic
    subcategory: opex
    region: city
    initial_value: 0.0
    expression: (  (1 - share_taxi_EV) * opex_taxi_IRR_km_base +   share_taxi_EV * opex_taxi_EV_IRR_km_base) * cost_index_50
  opex_taxi_IRR_km_base:
    type: input
    description: operating cost of taxis per km
    units: IRR/km
    category: economic
    subcategory: opex
    region: city
    initial_value: 1600
  pce_mot:
    type: input
    description: factor of passenger-car-equivalent  for motorcycles
    units: PCE/vehicle
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 0.3
  pce_car:
    type: input
    description: factor of passenger-car-equivalent  for private cars
    units: PCE/vehicle
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 1.0
  pce_tax:
    type: input
    description: factor of passenger-car-equivalent  for taxis
    units: PCE/vehicle
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 1.5
  pce_bus:
    type: input
    description: factor of passenger-car-equivalent  for buses
    units: PCE/vehicle
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 5.0
  pce_oth:
    type: input
    description: factor of passenger-car-equivalent for motorized modes
    units: PCE/vehicle
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 2.5
  vkm_mot_pce:
    type: expression
    description: distance of vehicle travel by motorcycles (PCE)
    units: PCE-km/year
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 0.0
    expression: vkm_motorcycle * pce_mot
  vkm_car_pce:
    type: expression
    description: distance of vehicle travel by cars (PCE)
    units: PCE-km/year
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 0.0
    expression: vkm_car * pce_car
  vkm_tax_pce:
    type: expression
    description: distance of vehicle travel by taxis (PCE)
    units: PCE-km/year
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 0.0
    expression: vkm_taxi * pce_tax
  vkm_bus_pce:
    type: expression
    description: distance of vehicle travel by buses (PCE)
    units: PCE-km/year
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 0.0
    expression: vkm_bus * pce_bus
  vkm_oth_pce:
    type: expression
    description: distance of vehicle travel by other motorized modes (PCE)
    units: PCE-km/year
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 0.0
    expression: vkm_other * pce_oth
  vkm_pce_total:
    type: expression
    description: total PCE-km (sum of PCE-weighted VKT by mode)
    units: PCE-km/year
    category: transport
    subcategory: traffic
    region: city
    usage: Exposure proxy for safety & emissions
    initial_value: 0.0
    expression: vkm_mot_pce + vkm_car_pce + vkm_tax_pce + vkm_bus_pce + vkm_oth_pce
  vkm_pce_total_hour:
    type: expression
    description: volume of road traffic (PCE)
    units: PCE-km/hour
    category: transport
    subcategory: congestion_capacity
    region: city
    initial_value: 0.0
    expression: vkm_pce_total / 8760.0
  vkm_mot_pce_r12:
    type: expression
    description: motorcycle VKT in region 12 in PCE units
    units: PCE-km/year
    category: transport
    subcategory: region12_performance
    region: region 12
    usage: derived
    initial_value: 0.0
    expression: vkm_motorcycle_r12 * pce_mot
  vkm_car_pce_r12:
    type: expression
    description: car VKT in region 12 in passenger-car-equivalent (PCE) units
    units: PCE-km/year
    category: transport
    subcategory: region12_performance
    region: region 12
    usage: derived
    initial_value: 0.0
    expression: vkm_car_r12 * pce_car
  vkm_tax_pce_r12:
    type: expression
    description: taxi VKT in region 12 in PCE units
    units: PCE-km/year
    category: transport
    subcategory: region12_performance
    region: region 12
    usage: derived
    initial_value: 0.0
    expression: vkm_taxi_r12 * pce_tax
  vkm_bus_pce_r12:
    type: expression
    description: bus VKT in region 12 in PCE units
    units: PCE-km/year
    category: transport
    subcategory: region12_performance
    region: region 12
    usage: derived
    initial_value: 0.0
    expression: vkm_bus_r12 * pce_bus
  vkm_oth_pce_r12:
    type: expression
    description: other modes VKT in region 12 in PCE units
    units: PCE-km/year
    category: transport
    subcategory: region12_performance
    region: region 12
    usage: derived
    initial_value: 0.0
    expression: vkm_oth_r12 * pce_oth
  vkm_pce_total_r12:
    type: expression
    description: total VKT in region 12 in PCE units
    units: PCE-km/year
    category: transport
    subcategory: region12_performance
    region: region 12
    usage: derived
    initial_value: 0.0
    expression: (vkm_mot_pce_r12 + vkm_car_pce_r12 + vkm_tax_pce_r12 + vkm_bus_pce_r12 + vkm_oth_pce_r12) * telework_trip_multiplier
  vkm_pce_total_hour_r12:
    type: expression
    description: hourly PCE-VKT in region 12 (annual / 8760)
    units: PCE-km/hour
    category: transport
    subcategory: region12_performance
    region: region 12
    usage: derived
    initial_value: 0.0
    expression: vkm_pce_total_r12 / 8760.0
  modal_share_mot_ptf:
    type: expression
    description: share of motorcycles (peak traffic flow)
    units: Fraction
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 0.0
    expression: vkm_mot_pce / (vkm_mot_pce + vkm_car_pce + vkm_tax_pce + vkm_bus_pce + vkm_oth_pce)
  modal_share_car_ptf:
    type: expression
    description: share of cars (peak traffic flow)
    units: Fraction
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 0.0
    expression: vkm_car_pce / (vkm_mot_pce + vkm_car_pce + vkm_tax_pce + vkm_bus_pce + vkm_oth_pce)
  modal_share_tax_ptf:
    type: expression
    description: share of taxis (peak traffic flow)
    units: Fraction
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 0.0
    expression: vkm_tax_pce / (vkm_mot_pce + vkm_car_pce + vkm_tax_pce + vkm_bus_pce + vkm_oth_pce)
  modal_share_bus_ptf:
    type: expression
    description: share of buses (peak traffic flow)
    units: Fraction
    category: transport
    subcategory: traffic_activity_pce
    region: city
    initial_value: 0.0
    expression: vkm_bus_pce / (vkm_mot_pce + vkm_car_pce + vkm_tax_pce + vkm_bus_pce + vkm_oth_pce)
  parking_tot:
    type: input
