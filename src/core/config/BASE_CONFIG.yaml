    type: input
    description: factor of minimum mitigation (lower bound) to avoid unrealistically large reductions
    units: Dimensionless
    category: environment
    subcategory: air_quality
    region: city
    initial_value: 0.5
    bounds:
    - 0.0
    - 1.0
  green_parks_area_m2:
    type: input
    description: area of public green space (parks)
    units: m²
    category: urban
    subcategory: green_public_space
    region: city
    initial_value: 37579486.0
  green_space_area_m2:
    type: expression
    description: area of public green space (parks + streets)
    units: m²
    category: urban
    subcategory: green_public_space
    region: city
    initial_value: 0.0
    expression: green_parks_area_m2 + green_streets_area_m2
  green_space_area_r12_m2:
    type: expression
    description: area of public green space (parks + streets)
    units: m²
