  births_total_year:
    type: expression
    description: number of births
    units: Persons/year
    category: social
    subcategory: demography
    region: city
    initial_value: 0.0
    expression: population_city * birth_rate_per_person_year
  household_size:
    type: input
    description: number of persons per household
