    category: environment
    subcategory: energy_use
    region: city
    initial_value: 0.0
    column: share_car_EV_histcal
  share_car_gasoline:
    type: expression
    description: share of car (ICE) vehicle-km
    units: Fraction
    category: environment
    subcategory: energy_use
    region: city
    initial_value: 0.0
    expression: max(1 - share_car_EV - share_car_CNG, 0)
  share_taxi_CNG_nonEV:
    type: input
    description: share of non-EV taxi vehicle-km using CNG
    units: Fraction
    category: environment
    subcategory: energy_use
