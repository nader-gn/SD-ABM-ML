agents:
  YEAR_GRG:
    type: input
    description: Gregorian year
    units: year
    category: time
    subcategory: calendar
    region: city
    initial_value: 2012.0
    bounds:
    - 1900.0
    - 2100.0
  days_per_year:
    type: input
    description: number of days per year
    units: days/year
    category: time
    subcategory: time_indexing
    region: city
    initial_value: 365.0
  GDP_city_IRR_year:
    type: expression
    description: GDP with trend projection
    units: IRR/year
    category: economic
    subcategory: macro
    region: city
    initial_value: 3130000000000000.0
    dependencies:
    - GDP_city_obs
    expression: GDP_city_obs if YEAR_GRG<=2023 else (4.91e+16 * ((1+0.284355340399971) ** (YEAR_GRG-2023)))
  GDP_per_capita_IRR_year:
    type: expression
    description: GDP per capita
    units: IRR/person/year
    category: economic
    subcategory: macro
    region: city
    initial_value: 0.0
    expression: GDP_city_IRR_year / max(population_city, 1)
  inflation_index_effective:
    type: stock
    description: cumulative inflation index (base_year=1; year-by-year compounding via inflation_rate_effective)
    units: Index (base_year=1)
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 1.0
    inflows:
    - inflation_index_effective_growth
  inflation_index_effective_growth:
    type: expression
    description: growth flow for inflation index
    units: Index/year
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 0.0
    expression: 0 if time == start_year else (inflation_index_effective * inflation_rate_effective)
  inflation_rate:
    type: input
    description: inflation rate [ml]
    units: Fraction
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 0.0
    column: inflation_rate_truth
  inflation_rate_effective:
    type: expression
    description: rate of inflation including shock
    units: 1/year
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 0.0
    expression: inflation_rate * (1 + (inflation_shock_factor - 1) * is_inflation_shock_active)
  inflation_shock_factor:
    type: input
    description: factor of inflation rate in the shock scenario
    units: Multiplier
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 1.5
  inflation_shock_start_year:
    type: input
    description: start year of inflation shock
    units: Year
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 2025.0
  is_inflation_shock_active:
    type: expression
    description: indicator of inflation shock activity
    units: Binary
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 0.0
    expression: 1 if time >= inflation_shock_start_year else 0
  cost_index_rhc_fare:
    type: stock
    description: cumulative rhc fare index (base_year=1; year-by-year compounding via rhc_fare_rate)
    units: Index (base_year=1)
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 1.0
    inflows:
    - cost_index_rhc_fare_growth
  cost_index_rhc_fare_growth:
    type: expression
    description: growth flow for rhc fare index
    units: Index/year
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 0.0
    expression: 0 if online_taxi_active == 0 else (cost_index_rhc_fare * rhc_fare_rate)
  rhc_fare_rate:
    type: input
    description: rhc fare rate
    units: Fraction
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 0.0
    column: rhc_fare_rate_truth
  cost_index_bus_fare:
    type: stock
    description: cumulative bus fare index (base_year=1; year-by-year compounding via bus_fare_rate)
    units: Index (base_year=1)
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 1.0
    inflows:
    - cost_index_bus_fare_growth
  cost_index_bus_fare_growth:
    type: expression
    description: growth flow for bus fare index
    units: Index/year
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 0.0
    expression: 0 if time == start_year else (cost_index_bus_fare * bus_fare_rate)
  bus_fare_rate:
    type: input
    description: bus fare rate
    units: Fraction
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 0.0
    column: bus_fare_rate_truth
  cost_index_metro_fare:
    type: stock
    description: cumulative metro fare index (base_year=1; year-by-year compounding via metro_fare_rate)
    units: Index (base_year=1)
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 1.0
    inflows:
    - cost_index_metro_fare_growth
  cost_index_metro_fare_growth:
    type: expression
    description: growth flow for metro fare index
    units: Index/year
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 0.0
    expression: 0 if time == start_year else (cost_index_metro_fare * metro_fare_rate)
  metro_fare_rate:
    type: input
    description: metro fare rate
    units: Fraction
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 0.0
    column: metro_fare_rate_truth
  municipal_budget_IRR_year:
    type: input
    column: municipal_budget_IRR_year_truth
    description: Municipal budget for Tehran (observed input series; Region 12 handled separately via explicit empirical proxy)
    units: IRR/year
    category: economic
    subcategory: budget
    region: city
  transport_budget_share:
    type: input
    description: share of municipal budget for transport
    units: Fraction
    category: economic
    subcategory: macro
    region: city
    initial_value: 0.45
  transport_budget_IRR_year:
    type: expression
    description: budget for transport
    units: IRR/year
    category: economic
    subcategory: macro
    region: city
    initial_value: 0.0
    expression: municipal_budget_IRR_year * transport_budget_share
  public_investment_rate_transport:
    type: input
    description: share of transport budget for capital investments (CAPEX)
    units: Fraction
    category: economic
    subcategory: macro
    region: city
    initial_value: 0.45
  CAPEX_transport_affordable_IRR_year:
    type: expression
    description: Affordable transport CAPEX including central earmarked-and-collected traffic-plan revenue.
    units: IRR/year
    category: economic
    subcategory: macro
    region: city
    initial_value: 0.0
    expression: transport_budget_IRR_year * public_investment_rate_transport + traffic_plan_revenue_earmark_share_transport
      * traffic_plan_revenue_collection_factor * traffic_plan_revenue_IRR_year
    dependencies:
    - transport_budget_IRR_year
    - public_investment_rate_transport
    - traffic_plan_revenue_earmark_share_transport
    - traffic_plan_revenue_collection_factor
    - traffic_plan_revenue_IRR_year
  share_CAPEX_bike_infra:
    type: input
    description: share of CAPEX for infrastructure (cycling)
    units: Fraction
    category: economic
    subcategory: capex
    usage: calibration
    region: city
    initial_value: 0.008
  share_CAPEX_road:
    type: input
    description: share of CAPEX for infrastructure (road/highway)
    units: Fraction
    category: economic
    subcategory: capex
    usage: calibration
    region: city
    initial_value: 0.08
  share_CAPEX_brt_infra:
    type: input
    description: share of CAPEX for infrastructure (BRT)
    units: Fraction
    category: economic
    subcategory: capex
    usage: calibration
    region: city
    initial_value: 0.02
  share_CAPEX_metro_infra:
    type: input
    description: share of CAPEX for infrastructure (metro)
    units: Fraction
    category: economic
    subcategory: capex
    usage: calibration
    region: city
    initial_value: 0.32
  share_CAPEX_infra_total:
    type: expression
    description: share of CAPEX for infrastructure (total; should be ≤ 1)
    units: Fraction
    category: economic
    subcategory: capex
    region: city
    initial_value: 0.0
    expression: share_CAPEX_road + share_CAPEX_metro_infra + share_CAPEX_brt_infra + share_CAPEX_bike_infra
  discount_rate_transport:
    type: input
    description: rate of real discount for CAPEX annualisation
    units: 1/year
    category: economic
    subcategory: capex
    region: city
    initial_value: 0.1
  lifetime_car_years:
    type: input
    description: lifetime of cars
    units: years
    category: economic
    subcategory: capex
    region: city
    initial_value: 10.0
  lifetime_bus_years:
    type: input
    description: lifetime of buses
    units: years
    category: economic
    subcategory: capex
    region: city
    initial_value: 12.0
  lifetime_metro_train_years:
    type: input
    description: lifetime of metro rolling stock
    units: years
    category: economic
    subcategory: capex
    region: city
    initial_value: 30.0
  lifetime_infrastructure_years:
    type: input
    description: lifetime of infrastructure (Metro + BRT)
    units: years
    category: economic
    subcategory: capex
    region: city
    initial_value: 40.0
  CRF_bus:
    type: expression
    description: factor of capital recovery for buses
    units: 1/year
    category: economic
    subcategory: capex
    region: city
    initial_value: 0.0
    expression: discount_rate_transport * (1 + discount_rate_transport) ** lifetime_bus_years / ((1 + discount_rate_transport)
      ** lifetime_bus_years - 1)
  CRF_car:
    type: expression
    description: factor of capital recovery for cars
    units: 1/year
    category: economic
    subcategory: capex
    region: city
    initial_value: 0.0
    expression: discount_rate_transport * (1 + discount_rate_transport) ** lifetime_car_years / ((1 + discount_rate_transport)
      ** lifetime_car_years - 1)
  CRF_infrastructure:
    type: expression
    description: factor of capital recovery for infrastructure
    units: 1/year
    category: economic
    subcategory: capex
    region: city
    initial_value: 0.0
    expression: discount_rate_transport * (1 + discount_rate_transport) ** lifetime_infrastructure_years / ((1 + discount_rate_transport)
      ** lifetime_infrastructure_years - 1)
  CRF_metro_rolling:
    type: expression
    description: factor of capital recovery for metro rolling stock
    units: 1/year
    category: economic
    subcategory: capex
    region: city
    initial_value: 0.0
    expression: discount_rate_transport * (1 + discount_rate_transport) ** lifetime_metro_train_years / ((1 + discount_rate_transport)
      ** lifetime_metro_train_years - 1)
  len_bik:
    type: stock
    description: length of routes (bicycle) (history-anchored stock; endogenous in projection)
    units: km
    category: transport
    subcategory: infrastructure
    region: city
    initial_value: 192.0
    inflows:
    - hist_add_bike_km_year
    - expansion_bike_km_year
    outflows:
    - hist_remove_bike_km_year
  len_bus:
    type: input
    description: length of routes (bus) (anchored input)
    units: km
    category: transport
    subcategory: network_supply
    region: city
    initial_value: 2870.0
    column: len_bus
    bounds:
    - 0.0
    - 100000.0
  len_brt:
    type: stock
    description: length of routes (BRT) (history-anchored stock; endogenous in projection)
    units: km
    category: transport
    subcategory: infrastructure
    region: city
    initial_value: 115.0
    inflows:
    - hist_add_BRT_km_year
    - expansion_BRT_km_year
    outflows:
    - hist_remove_BRT_km_year
  len_hwy:
    type: stock
    description: length of routes (highways and major streets) (history-anchored stock; endogenous in projection)
    units: km
    category: transport
    subcategory: infrastructure
    region: city
    initial_value: 1735.0
    inflows:
    - hist_add_road_km_year
    - expansion_road_km_year
    outflows:
    - hist_remove_road_km_year
  len_met:
    type: stock
    description: length of lines (metro) (history-anchored stock; endogenous in projection)
    units: km
    category: transport
    subcategory: infrastructure
    region: city
    initial_value: 140.0
    inflows:
    - hist_add_metro_km_year
    - expansion_metro_km_year
    outflows:
    - hist_remove_metro_km_year
  len_bik_obs_city:
    type: input
    description: observed bicycle route length for historical anchoring
    units: km
    category: transport
    subcategory: infrastructure
    region: city
    initial_value: 192.0
    column: LEN_BIK
    bounds:
    - 0.0
    - 100000.0
  len_brt_obs_city:
    type: input
    description: observed BRT route length for historical anchoring
    units: km
    category: transport
    subcategory: infrastructure
    region: city
    initial_value: 115.0
    column: len_brt
    bounds:
    - 0.0
    - 100000.0
  len_hwy_obs_city:
    type: input
    description: observed highway/major-road length for historical anchoring
    units: km
    category: transport
    subcategory: infrastructure
    region: city
    initial_value: 1735.0
    column: len_hwy
    bounds:
    - 0.0
    - 100000.0
  len_met_obs_city:
    type: input
    description: observed metro line length for historical anchoring
    units: km
    category: transport
    subcategory: infrastructure
    region: city
    initial_value: 140.0
    column: len_met
    bounds:
    - 0.0
    - 100000.0
  len_bik_hist_target:
    type: expression
    description: historical bicycle length target (holds last valid observation if missing)
    units: km
    category: transport
    subcategory: infrastructure
    region: city
    initial_value: 192.0
    dependencies:
    - YEAR_GRG
    - len_bik_obs_city
    - len_bik
    expression: len_bik_obs_city if (YEAR_GRG<=2023 and len_bik_obs_city>0) else len_bik
  len_brt_hist_target:
    type: expression
    description: historical BRT length target
    units: km
    category: transport
    subcategory: infrastructure
    region: city
    initial_value: 115.0
    dependencies:
    - YEAR_GRG
    - len_brt_obs_city
    - len_brt
    expression: len_brt_obs_city if (YEAR_GRG<=2023 and len_brt_obs_city>0) else len_brt
  len_hwy_hist_target:
    type: expression
    description: historical highway length target
    units: km
    category: transport
    subcategory: infrastructure
    region: city
    initial_value: 1735.0
    dependencies:
    - YEAR_GRG
    - len_hwy_obs_city
    - len_hwy
    expression: len_hwy_obs_city if (YEAR_GRG<=2023 and len_hwy_obs_city>0) else len_hwy
  len_met_hist_target:
    type: expression
    description: historical metro length target
    units: km
    category: transport
    subcategory: infrastructure
    region: city
    initial_value: 140.0
    dependencies:
    - YEAR_GRG
    - len_met_obs_city
    - len_met
    expression: len_met_obs_city if (YEAR_GRG<=2023 and len_met_obs_city>0) else len_met
  hist_add_bike_km_year:
    type: expression
    description: historical bicycle-length add flow used only through 2023
    units: km/year
    category: transport
    subcategory: network_supply
    region: city
    initial_value: 0.0
    dependencies:
    - YEAR_GRG
    - len_bik_hist_target
    - len_bik
    expression: 0 if YEAR_GRG>2023 else max(0, len_bik_hist_target - len_bik)
  hist_remove_bike_km_year:
    type: expression
    description: historical bicycle-length removal flow used only through 2023
    units: km/year
    category: transport
    subcategory: network_supply
    region: city
    initial_value: 0.0
    dependencies:
    - YEAR_GRG
    - len_bik_hist_target
    - len_bik
