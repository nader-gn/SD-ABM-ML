  population_15_64:
    type: input
    description: population (aged 15–64)
    units: Persons
    category: social
    subcategory: demography
    region: city
    initial_value: 6.216E6
    column: population_15_64_truth
  population_65_plus:
    type: input
    description: population (aged 65+)
    units: Persons
    category: social
    subcategory: demography
    region: city
    initial_value: 0.714E6
    column: population_65_plus_truth
  population_city:
    type: stock
    description: population
    units: Persons
    category: social
    subcategory: demography
    region: city
