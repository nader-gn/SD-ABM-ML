    units: Passenger-km/year
    category: transport
    subcategory: traffic_activity_city
    region: city
    initial_value: 0.0
    expression: trips_other * trip_length_km
  pkm_metro:
    type: expression
    description: distance of passenger travel by metro
    units: Passenger-km/year
    category: transport
    subcategory: traffic_activity_city
    region: city
    initial_value: 0.0
    expression: trips_metro * trip_length_km
  pkm_total:
    type: expression
