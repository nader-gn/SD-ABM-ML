  mortality_adult_rate:
    type: expression
    description: baseline demographic mortality rate (adults) used in the population balance; incremental transport-attributable mortality is represented separately
    units: 1/person/year
    category: social
    subcategory: health_impacts
    usage: calibration
    region: city
    initial_value: 0.0
    expression: 0.0065
  mortality_child_rate:
    type: expression
    description: baseline demographic mortality rate (children) used in the population balance; incremental transport-attributable mortality is represented separately
    units: 1/person/year
    category: social
    subcategory: health_impacts
    usage: calibration
    region: city
    initial_value: 0.0
    expression: 0.00045
  beta_noise_EV:
    type: input
    description: sensitivity of noise exposure to EV share
    units: Dimensionless
    category: environment
    subcategory: noise_parameters
    region: city
    initial_value: 0.3
  beta_noise_congestion:
    type: input
    description: sensitivity of noise exposure to congestion
    units: Dimensionless
    category: environment
    subcategory: noise_parameters
    region: city
    initial_value: 0.6
  beta_noise_green:
    type: input
    description: sensitivity of noise exposure to green-space share
    units: Dimensionless
    category: environment
    subcategory: noise_parameters
    region: city
    initial_value: 0.4
  noise_exposure_index:
    type: expression
    description: index of exposure to traffic noise (Increases with congestion, decreases with EV share and green space)
    units: Dimensionless
    category: environment
    subcategory: noise_parameters
    region: city
    initial_value: 0.0
    expression: max(0.2,   1   + beta_noise_congestion * congestion_index   - beta_noise_EV * EV_share_vkm_weighted   - beta_noise_green
      * green_space_share_of_urban_area)
  noise_base_cost_IRR_year:
