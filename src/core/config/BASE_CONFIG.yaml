simulation:
  name: Tehran_SD_ABM_ML_Baseline
  data_file: config/DATA_clean.csv
history_align_col: YEAR_GRG
runtime:
  random_seed: 42
  save_full_env_dump: false
resources:
  max_memory_mb: 4096
  enable_logging: true
  log_level: INFO
delayed_evaluation:
  enabled: true
  nodes:
  - modal_share_car
  - modal_share_car_r12
  prefixes:
  - travel_time_
  - spd_
  - dly_
  regex: []
constraints:
  enabled: true
  groups:
  - name: city_modal_shares_sum1
    members:
    - modal_share_bus
    - modal_share_metro
    - modal_share_taxi
    - modal_share_motorcycle
    - modal_share_other
    - modal_share_car
    enabled: true
    target_sum: 1.0
    smoothing_alpha: 0.001
    clip_min: 0.0
    clip_max: 0.95
    update_rate: 1.0
    apply_in_history: true
    apply_in_forecast: true
    mode: normalize_to_sum
  - name: r12_modal_shares_sum1
    members:
    - modal_share_bus_r12
    - modal_share_met_r12
    - modal_share_tax_r12
    - modal_share_mot_r12
    - modal_share_oth_r12
    - modal_share_car_r12
