    subcategory: baseline
    region: city
    initial_value: 0.28
  spd_bus_freeflow_base:
    type: input
    description: baseline reference for spd_bus_freeflow_base
    units: '-'
    category: policy_ref
    subcategory: baseline
    region: city
    initial_value: 38.360243178482364
  spd_met_base:
    type: input
    description: baseline reference for spd_met_base
    units: '-'
    category: policy_ref
    subcategory: baseline
    region: city
