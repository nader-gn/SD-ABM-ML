  fuel_price_multiplier_base:
    type: input
    description: baseline reference for fuel_price_multiplier_base
    units: '-'
    category: policy_ref
    subcategory: baseline
    region: city
    initial_value: 1.0
  traffic_plan_fee_multiplier_base:
    type: input
    description: baseline reference for traffic_plan_fee_multiplier_base
    units: '-'
    category: policy_ref
    subcategory: baseline
    region: city
    initial_value: 1.0
  coef_k_fuel:
    type: input
    description: policy adjustment coefficient k_fuel
    units: '-'
    category: policy_ref
    subcategory: coeff
    region: city
    initial_value: 0.35
    bounds:
    - 0.0
    - 2.0
  coef_k_fee:
    type: input
    description: policy adjustment coefficient k_fee
    units: '-'
    category: policy_ref
    subcategory: coeff
    region: city
    initial_value: 0.25
    bounds:
    - 0.0
    - 2.0
  coef_k_fare:
    type: input
    description: policy adjustment coefficient k_fare
    units: '-'
    category: policy_ref
    subcategory: coeff
    region: city
    initial_value: 0.4
    bounds:
    - 0.0
    - 2.0
  coef_k_speed:
    type: input
    description: policy adjustment coefficient k_speed
    units: '-'
    category: policy_ref
    subcategory: coeff
    region: city
    initial_value: 0.3
    bounds:
    - 0.0
    - 2.0
  adj_factor_car_policy:
    type: expression
    description: Multiplicative policy adjustment for car share (projection only)
    units: '-'
    category: policy
    subcategory: adjustment
    region: city
    initial_value: 1.0
    expression: (0.9751) * (exp(-coef_k_fee*(traffic_plan_fee_multiplier/traffic_plan_fee_multiplier_base - 1.0) - 0.20*coef_k_park*(parking_supply_multiplier_r12_base/max(parking_supply_multiplier_r12,
      1e-6) - 1.0) - 0.45*coef_k_commute*(commute_management_multiplier/commute_management_multiplier_base - 1.0)) if YEAR_GRG>=2024
      else 1.0)
  adj_factor_bus_policy:
    type: expression
    description: Multiplicative policy adjustment for bus share (projection only)
    units: '-'
    category: policy
    subcategory: adjustment
    region: city
    initial_value: 1.0
    expression: (0.9929) * (exp(-coef_k_fare*(bus_fare_rate/bus_fare_rate_base - 1.0) + coef_k_speed*(spd_bus_freeflow/spd_bus_freeflow_base
      - 1.0) + 0.20*coef_k_commute*(commute_management_multiplier/commute_management_multiplier_base - 1.0)) if YEAR_GRG>=2024
      else 1.0)
  adj_factor_metro_policy:
    type: expression
    description: Multiplicative policy adjustment for metro share (projection only)
    units: '-'
    category: policy
    subcategory: adjustment
    region: city
    initial_value: 1.0
    expression: (0.9787) * (exp(-coef_k_fare*(metro_fare_rate/metro_fare_rate_base - 1.0) + coef_k_speed*(spd_met/spd_met_base
      - 1.0) + 0.24*coef_k_commute*(commute_management_multiplier/commute_management_multiplier_base - 1.0)) if YEAR_GRG>=2024
      else 1.0)
  adj_factor_taxi_policy:
    type: expression
    description: Neutral policy adjustment for taxi share
    units: '-'
    category: policy
    subcategory: adjustment
    region: city
    initial_value: 1.0
    expression: (0.9668) * (exp(-0.6*coef_k_fee*(traffic_plan_fee_multiplier/traffic_plan_fee_multiplier_base - 1.0) - 0.05*coef_k_park*(parking_supply_multiplier_r12_base/max(parking_supply_multiplier_r12,
      1e-6) - 1.0) - 0.08*coef_k_commute*(commute_management_multiplier/commute_management_multiplier_base - 1.0)) if YEAR_GRG>=2024
      else 1.0)
  adj_factor_motorcycle_policy:
    type: expression
    description: Neutral policy adjustment for motorcycle share
    units: '-'
    category: policy
    subcategory: adjustment
    region: city
    initial_value: 1.0
    expression: ((1.1422) * exp(-0.8*coef_k_fuel*(fuel_price_multiplier/fuel_price_multiplier_base - 1.0) - 0.18*coef_k_commute*(commute_management_multiplier/commute_management_multiplier_base
      - 1.0))) if YEAR_GRG>=2024 else 1.0
  adj_factor_other_policy:
    type: expression
    description: Neutral policy adjustment for other share
    units: '-'
    category: policy
    subcategory: adjustment
    region: city
    initial_value: 1.0
    expression: (0.9557) * (exp(0.10*coef_k_commute*(commute_management_multiplier/commute_management_multiplier_base - 1.0))
      if YEAR_GRG>=2024 else 1.0)
  policy_norm_denom_city:
    type: expression
    description: Denominator for policy-adjusted motorized modal shares (city)
    units: '-'
    category: policy
    subcategory: adjustment
    region: city
    initial_value: 1.0
    expression: (modal_share_car_ml*adj_factor_car_policy + modal_share_bus_ml*adj_factor_bus_policy + modal_share_metro_ml*adj_factor_metro_policy
      + modal_share_taxi_ml*adj_factor_taxi_policy + modal_share_motorcycle_ml*adj_factor_motorcycle_policy + modal_share_other_ml*adj_factor_other_policy)
  modal_share_car_adj:
    type: expression
