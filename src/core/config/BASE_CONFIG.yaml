    category: social
    subcategory: demography
    usage: calibration
    region: city
    initial_value: 0.0
    expression: 0.00556
    notes: Historical population-flow calibration. The coefficient is reproduced from the 2012-2023 observed city population growth in continuous-rate form after accounting for the configured birth rate and population-weighted baseline demographic mortality; the replay value 0.00555739 rounds to the deployed 0.00556.
  migrations_total_year:
    type: expression
    description: number of migrations
    units: Persons/year
    category: social
    subcategory: demography
