    subcategory: external_costs
    region: city
    initial_value: 0.0
    expression: cost_energy_IRR_year + cost_health_IRR_year + cost_road_safety_IRR_year + cost_climate_IRR_year + cost_congestion_IRR_year
      + cost_noise_IRR_year
  external_cost_IRR_year_r12:
    type: expression
    description: 'total external cost (region 12): non-congestion externalities downscaled + region-specific congestion cost'
    units: IRR/year
    category: impact
    subcategory: external_costs
    region: region 12
    initial_value: 0.0
    expression: (external_cost_IRR_year - cost_congestion_IRR_year) * share_vkm_motorized_r12_city + cost_congestion_IRR_year_r12
  fare_bus_IRR_trip_indexed:
    type: expression
    description: 'Bus fare per trip: observed during hindcast and index-projected after 2023 without the previous extra current-year
      fare-rate multiplier.'
    units: IRR/trip
    category: economic
    subcategory: fares_revenue
    region: city
    initial_value: 0.0
    expression: fare_bus_observed_IRR_trip if YEAR_GRG <= 2023 else (fare_bus_projection_base_IRR_trip * cost_index_bus_fare)
    dependencies:
    - fare_bus_observed_IRR_trip
    - YEAR_GRG
    - fare_bus_projection_base_IRR_trip
    - cost_index_bus_fare
  fare_metro_IRR_trip_indexed:
    type: expression
    description: 'Metro fare per trip: observed during hindcast and index-projected after 2023 without the previous extra
      current-year fare-rate multiplier.'
    units: IRR/trip
    category: economic
    subcategory: fares_revenue
    region: city
    initial_value: 0.0
    expression: fare_metro_observed_IRR_trip if YEAR_GRG <= 2023 else (fare_metro_projection_base_IRR_trip * cost_index_metro_fare)
    dependencies:
    - fare_metro_observed_IRR_trip
    - YEAR_GRG
