    subcategory: emissions_city
    region: city
    initial_value: 0.03
  EF_PM25_taxi_g_km:
    type: input
    description: emission factor of PM₂.₅ for taxis (tailpipe)
    units: g/km
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.015
  EF_SO2_bus_g_km:
    type: input
    description: emission factor of SO₂ for buses (tailpipe)
    units: g/km
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.5
  EF_SO2_car_g_km:
    type: input
    description: emission factor of SO₂ for private cars (tailpipe)
    units: g/km
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.03
  EF_SO2_motorcycle_g_km:
    type: input
    description: emission factor of SO₂ for motorcycles (tailpipe)
    units: g/km
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.02
  EF_SO2_taxi_g_km:
    type: input
    description: emission factor of SO₂ for taxis (tailpipe)
    units: g/km
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.04
  EF_grid_NOx_g_kWh:
    type: input
    description: emission factor of NOₓ from electricity (grid)
    units: g/kWh
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.7
  EF_grid_PM25_g_kWh:
    type: input
    description: emission factor of PM₂.₅ from electricity (grid)
    units: g/kWh
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.05
  EF_grid_SO2_g_kWh:
    type: input
    description: emission factor of SO₂ from electricity (grid)
    units: g/kWh
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 1.0
  EV_share_vkm_weighted:
    type: expression
    description: share of EVs in total road vehicle-km (cars, taxis, motorcycles, buses)
    units: Fraction
    category: environment
    subcategory: energy_use
    region: city
    initial_value: 0.0
    expression: (vkm_car_EV + vkm_taxi_EV + vkm_motorcycle_EV + vkm_bus_EV) / max(vkm_car + vkm_taxi + vkm_motorcycle + vkm_bus,
      1)
  LHV_CNG_MJ_kg:
    type: input
    description: energy content of CNG
    units: MJ/kg
    category: environment
    subcategory: energy_use
    region: city
    initial_value: 50.0
  LHV_diesel_MJ_litre:
    type: input
    description: energy content of diesel
    units: MJ/litre
    category: environment
    subcategory: energy_use
    region: city
    initial_value: 38.6
  LHV_electricity_MJ_kWh:
    type: input
    description: energy content of electricity
    units: MJ/kWh
    category: environment
    subcategory: energy_use
    region: city
    initial_value: 3.6
  LHV_gasoline_MJ_litre:
    type: input
    description: energy content of gasoline
    units: MJ/litre
    category: environment
    subcategory: energy_use
    region: city
    initial_value: 34.2
  NO2_background_ugm3:
    type: input
    description: concentration of NO₂ (background; non-transport sources)
    units: µg/m³
    category: environment
    subcategory: air_quality
    region: city
    initial_value: 37.623683534810446
  NO2_threshold_ugm3:
    type: input
    description: concentration of NO₂ (health-based threshold)
    units: µg/m³
    category: environment
    subcategory: air_quality
    region: city
    initial_value: 10.0
  NOx_g_year:
    type: expression
    description: emissions of Noₓ (tailpipe + grid)
    units: g/year
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.0
    expression: NOx_tailpipe_g_year + NOx_grid_g_year
  NOx_grid_g_year:
    type: expression
    description: emissions of NOₓ (grid; metro + Evs)
    units: g/year
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.0
    expression: EF_grid_NOx_g_kWh * electricity_transport_kWh_year
  NOx_t_year:
    type: expression
    description: emissions of NOₓ (tailpipe + grid)
    units: t/year
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.0
    expression: NOx_g_year / 1e6
  NOx_tailpipe_g_year:
    type: expression
    description: emissions of NOₓ (tailpipe)
    units: g/year
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.0
    expression: EF_NOx_car_g_km * vkm_car_tailpipe + EF_NOx_bus_g_km * vkm_bus_tailpipe + EF_NOx_taxi_g_km * vkm_taxi_tailpipe
      + EF_NOx_motorcycle_g_km * vkm_motorcycle_tailpipe
  PM25_background_ugm3:
    type: input
    description: concentration of PM₂.₅ (background; non-transport sources)
    units: µg/m³
    category: environment
    subcategory: air_quality
    region: city
    initial_value: 26.021591915861528
  PM25_g_year:
    type: expression
    description: emissions of PM₂.₅ (grid + tailpipe)
    units: g/year
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.0
    expression: PM25_tailpipe_g_year + PM25_grid_g_year
  PM25_grid_g_year:
    type: expression
    description: emissions of PM₂.₅ (grid; metro + Evs)
    units: g/year
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.0
    expression: EF_grid_PM25_g_kWh * electricity_transport_kWh_year
  PM25_t_year:
    type: expression
    description: emissions of PM₂.₅ (grid + tailpipe)
    units: t/year
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.0
    expression: PM25_g_year / 1e6
  PM25_t_year_r12:
    type: expression
    description: Direct Region 12 PM2.5 emissions from district modal VKT, technology shares, emission factors, and grid electricity
    units: t/year
    category: environment
    subcategory: emissions_region
    region: region 12
    initial_value: 0.0
    expression: (EF_PM25_car_g_km * vkm_car_r12 * car_energy_closure_factor * (1 - share_car_EV) + EF_PM25_bus_g_km * vkm_bus_r12
      * (1 - share_bus_EV) + EF_PM25_taxi_g_km * vkm_taxi_r12 * (1 - share_taxi_EV) + EF_PM25_motorcycle_g_km * vkm_motorcycle_r12
      * (1 - share_motorcycle_EV) + EF_grid_PM25_g_kWh * electricity_kWh_year_r12) / 1e6
  PM25_tailpipe_g_year:
    type: expression
    description: emissions of PM₂.₅ (tailpipe)
    units: g/year
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.0
    expression: EF_PM25_car_g_km * vkm_car_tailpipe + EF_PM25_bus_g_km * vkm_bus_tailpipe + EF_PM25_taxi_g_km * vkm_taxi_tailpipe
      + EF_PM25_motorcycle_g_km * vkm_motorcycle_tailpipe
  PM25_threshold_ugm3:
    type: input
    description: concentration of PM₂.₅ (health-based threshold)
    units: µg/m³
    category: environment
    subcategory: air_quality
    region: city
    initial_value: 10.0
  PT_affordability_ratio:
    type: expression
    description: share of income spent on public transport
    units: Fraction
    category: economic
    subcategory: fares_revenue
    region: city
    initial_value: 0.0
    expression: PT_expenditure_per_person_IRR_year / max(household_income_per_capita_IRR_year, 1)
  PT_expenditure_per_person_IRR_year:
    type: expression
    description: expenditure on public transport per person
    units: IRR/person/year
    category: economic
    subcategory: fares_revenue
    region: city
    initial_value: 0.0
    expression: PT_trips_per_person_per_year * (modal_share_bus/modal_share_PT * fare_bus_IRR_trip_indexed + modal_share_metro/modal_share_PT
      * fare_metro_IRR_trip_indexed)
  OPEX_PT_IRR_year:
    type: expression
    description: operating cost of public transport (total)
    units: IRR/year
    category: economic
    subcategory: fares_revenue
    region: city
    initial_value: 0.0
    expression: OPEX_bus_IRR_year + OPEX_BRT_IRR_year + OPEX_metro_IRR_year + cost_energy_PT_IRR_year
  OPEX_PT_deficit_IRR_year:
    type: expression
    description: nonnegative PT operating deficit
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: city
    initial_value: 0.0
    expression: max(OPEX_PT_IRR_year - revenue_transport_public_IRR_year, 0)
    dependencies:
    - OPEX_PT_IRR_year
    - revenue_transport_public_IRR_year
  PT_trips_per_person_per_year:
    type: expression
    description: number of trips by public transport per person
    units: Trips/person/year
    category: economic
    subcategory: fares_revenue
    region: city
    initial_value: 0.0
    expression: PT_trips_total / max(population_city, 1)
  PT_trips_total:
    type: expression
    description: number of trips by public transport (bus + metro)
    units: Trips/year
    category: economic
    subcategory: fares_revenue
    region: city
    initial_value: 0.0
    expression: trips_bus_total + trips_metro
  RR_NO2:
    type: expression
    description: relative risk of mortality due to NO₂ exposure (above threshold)
    units: Dimensionless
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.0
    expression: exp(CR_NO2_mortality * concentration_NO2_excess_ugm3)
  RR_PM25:
    type: expression
    description: relative risk of mortality due to PM₂.₅ exposure (above threshold)
    units: Dimensionless
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.0
    expression: exp(CR_PM25_mortality_adult * concentration_PM25_excess_ugm3)
  RR_PM25_adult:
    type: expression
    description: relative risk of adult mortality due to PM₂.₅ exposure (above threshold)
    units: Dimensionless
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.0
    expression: exp(CR_PM25_mortality_adult * concentration_PM25_excess_ugm3)
  RR_PM25_child:
    type: expression
    description: relative risk of child mortality due to PM₂.₅ exposure (above threshold)
    units: Dimensionless
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.0
    expression: exp(CR_PM25_mortality_child * concentration_PM25_excess_ugm3)
  SO2_g_year:
    type: expression
    description: emissions of SO₂ (tailpipe + grid)
    units: g/year
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.0
    expression: SO2_tailpipe_g_year + SO2_grid_g_year
  SO2_grid_g_year:
    type: expression
    description: emissions of SO₂ (grid; metro + EVs)
    units: g/year
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.0
    expression: EF_grid_SO2_g_kWh * electricity_transport_kWh_year
  SO2_tailpipe_g_year:
    type: expression
    description: emissions of SO₂ (tailpipe)
    units: g/year
    category: environment
    subcategory: emissions_city
    region: city
    initial_value: 0.0
    expression: EF_SO2_car_g_km * vkm_car_tailpipe + EF_SO2_bus_g_km * vkm_bus_tailpipe + EF_SO2_taxi_g_km * vkm_taxi_tailpipe
      + EF_SO2_motorcycle_g_km * vkm_motorcycle_tailpipe
  VOT_IRR_per_hour_base:
    type: input
    description: Value of Time in base-year IRR/hour (informed by Tehran/Iran studies)
    units: IRR/hour
    category: economic
    subcategory: external_costs
    region: city
    usage: calibration
    initial_value: 150000.0
  VOT_IRR_per_hour_effective:
    type: expression
    description: VOT indexed by cumulative inflation (real base -> nominal)
    units: IRR/hour
    category: economic
    subcategory: external_costs
    region: city
    usage: derived
    initial_value: 0.0
    expression: VOT_IRR_per_hour_base * cost_index_0
  VSL_IRR:
    type: input
    description: value of a statistical life
    units: IRR/person
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 400000000000.0
  acc_fatl:
    type: expression
    description: acc_fatl (CAGR trend projection)
    units: Persons/year
    category: social
    subcategory: safety
    region: city
    initial_value: 1146.0
    dependencies:
    - acc_fatl_obs
    expression: acc_fatl_obs if YEAR_GRG<=2023 else (614.0 * ((1+-0.05515154031215952) ** (YEAR_GRG-2023)))
  acc_serious_injuries:
    type: input
    description: number of serious road-traffic injuries
    units: Injuries/year
    category: social
    subcategory: safety
    region: city
    initial_value: 0.0
  alpha_green_NO2:
    type: input
    description: sensitivity of NO₂ dispersion to green-space share
    units: Dimensionless
    category: environment
    subcategory: air_quality
    region: city
    initial_value: 0.4
  alpha_green_PM25:
    type: input
    description: sensitivity of PM₂.₅ dispersion to green-space share (0=no effect, 0.5=moderate mitigation)
    units: Dimensionless
    category: environment
    subcategory: air_quality
    region: city
    initial_value: 0.5
  are_r12:
    type: input
    description: area of urban land
    units: km2
    category: urban
    subcategory: land_use_structure
    region: region 12
    initial_value: 16.01
  baseline_deaths_adult_year:
    type: expression
    description: baseline demographic deaths (adults), excluding the incremental transport-attributable mortality represented separately
    units: Deaths/year
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.0
    expression: (population_15_64 + population_65_plus) * mortality_adult_rate
  baseline_deaths_child_year:
    type: expression
    description: baseline demographic deaths (children), excluding the incremental transport-attributable mortality represented separately
    units: Deaths/year
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.0
    expression: population_0_14 * mortality_child_rate
  baseline_deaths_total_year:
    type: expression
    description: baseline demographic deaths (adults + children) used in the population balance
    units: Deaths/year
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.0
    expression: baseline_deaths_adult_year + baseline_deaths_child_year
  respiratory_admission_rate_base:
    type: input
    description: rate of respiratory hospital admissions
    units: fraction
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.05
  capacity_PCE_per_km_hour:
    type: input
    description: capacity of road network (PCE)
    units: PCE/km/hour
    category: transport
    subcategory: congestion_capacity
    region: city
    initial_value: 3500.0
  cars_per_trainset:
    type: input
    description: number of metro cars (wagons) per trainset (used to convert train-km source data to car-km)
    units: car/trainset
    category: transport
    subcategory: metro
    region: city
    usage: calibration
    initial_value: 7.0
  con_dst_r12:
    type: input
    description: share of distance travelled under congested conditions
    units: Fraction
    category: transport
    subcategory: region12_performance
    region: region 12
    initial_value: 0.652
  concentration_NO2_excess_ugm3:
    type: expression
    description: Concentration of NO₂ (exceeding the health-based threshold)
    units: µg/m³
    category: environment
    subcategory: air_quality
    region: city
    initial_value: 0.0
    expression: max(concentration_NO2_ugm3 - NO2_threshold_ugm3, 0)
  concentration_NO2_ugm3:
    type: expression
    description: Concentration of NO₂ (transport and green space mitigation effects)
    units: µg/m³
    category: environment
    subcategory: air_quality
    region: city
    initial_value: 0.0
    expression: NO2_background_ugm3 + k_NO2_concentration_effective_ugm3_per_t * NOx_t_year
  concentration_PM25_excess_ugm3:
    type: expression
    description: Concentration of PM₂.₅ (exceeding the health-based threshold)
    units: µg/m³
    category: environment
    subcategory: air_quality
    region: city
    initial_value: 0.0
    expression: max(concentration_PM25_ugm3 - PM25_threshold_ugm3, 0)
  concentration_PM25_ugm3:
    type: expression
    description: Concentration of PM₂.₅ (transport and green space mitigation effects)
    units: µg/m³
    category: environment
    subcategory: air_quality
    region: city
    initial_value: 0.0
    expression: PM25_background_ugm3 + k_PM25_concentration_effective_ugm3_per_t * PM25_t_year
  cost_climate_IRR_year:
    type: expression
    description: cost of climate damages (CO₂ emissions)
    units: IRR/year
    category: impact
    subcategory: external_costs
    region: city
    initial_value: 0.0
    expression: CO2_t_year * cost_of_carbon_IRR_t
  cost_congestion_IRR_year:
    type: expression
    description: monetized congestion cost based on time loss and VOT
    units: IRR/year
    category: economic
    subcategory: external_costs
    region: city
    usage: derived
    initial_value: 0.0
    expression: time_loss_car_hours_year * VOT_IRR_per_hour_effective
  cost_congestion_IRR_year_r12:
    type: expression
    description: monetized congestion cost in region 12 based on car time loss and VOT (inflation-indexed via VOT)
    units: IRR/year
    category: economic
    subcategory: external_costs
    region: region 12
    usage: derived
    initial_value: 0.0
    expression: time_loss_car_hours_year_r12 * VOT_IRR_per_hour_effective
  cost_energy_IRR_year:
    type: expression
    description: cost of energy used in transport system (total)
    units: IRR/year
    category: economic
    subcategory: opex
    region: city
    initial_value: 0.0
    expression: cost_fuel_gasoline_IRR_year + cost_fuel_diesel_IRR_year + cost_fuel_CNG_IRR_year + electricity_cost_transport_IRR_year
  cost_health_IRR_year:
    type: expression
    description: cost of health impacts from pollution (mortality and morbidity)
    units: IRR/year
    category: impact
    subcategory: external_costs
    region: city
    initial_value: 0.0
    expression: economic_value_deaths_IRR + economic_value_admissions_IRR
  cost_health_IRR_year_r12:
    type: expression
    description: cost of health impacts from pollution (region 12; downscaled by motorized activity share)
    units: IRR/year
    category: impact
    subcategory: external_costs
    region: region 12
    initial_value: 0.0
    expression: cost_health_IRR_year * share_vkm_motorized_r12_city
  cost_hospital_day_IRR_base:
    type: input
    description: cost of a hospital day (respiratory treatment)
    units: IRR/day
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 1E6
  cost_hospital_day_IRR_indexed:
    type: expression
    description: cost of a hospital day (inflation adjusted)
    units: IRR/day
    category: social
    subcategory: health_impacts
    region: city
    expression: cost_hospital_day_IRR_base * cost_index_0
  cost_index_0:
    type: expression
    description: 'blended index: inflation^(1-s) * fx^s'
    units: Index (base_year=1)
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 1.0
    expression: (inflation_index_effective ** (1 - import_share_0)) * (fx_index_effective ** import_share_0)
  cost_index_20:
    type: expression
    description: 'blended index: inflation^(1-s) * fx^s'
    units: Index (base_year=1)
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 1.0
    expression: (inflation_index_effective ** (1 - import_share_20)) * (fx_index_effective ** import_share_20)
  cost_index_50:
    type: expression
    description: 'blended index: inflation^(1-s) * fx^s'
    units: Index (base_year=1)
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 1.0
    expression: (inflation_index_effective ** (1 - import_share_50)) * (fx_index_effective ** import_share_50)
  cost_index_70:
    type: expression
    description: 'blended index: inflation^(1-s) * fx^s'
    units: Index (base_year=1)
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 1.0
    expression: (inflation_index_effective ** (1 - import_share_70)) * (fx_index_effective ** import_share_70)
  cost_index_80:
    type: expression
    description: 'blended index: inflation^(1-s) * fx^s'
    units: Index (base_year=1)
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 1.0
    expression: (inflation_index_effective ** (1 - import_share_80)) * (fx_index_effective ** import_share_80)
  cost_index_100:
    type: expression
    description: 'blended index: inflation^(1-s) * fx^s'
    units: Index (base_year=1)
    category: economic
    subcategory: prices_inflation_fx
    region: city
    initial_value: 1.0
    expression: (inflation_index_effective ** (1 - import_share_100)) * (fx_index_effective ** import_share_100)
  cost_per_fatality_IRR:
    type: input
    description: cost of a transport fatality
    units: IRR/death
    category: social
    subcategory: safety
    region: city
    initial_value: 400000000000.0
  cost_per_serious_injury_IRR:
    type: input
    description: cost of a serious traffic injury (medical + productivity loss)
    units: IRR/injury
    category: social
    subcategory: safety
    region: city
    initial_value: 50000000000.0
  external_cost_per_trip_IRR:
    type: expression
    description: cost of externalities per trip
    units: IRR/trip
    category: impact
    subcategory: system_costs
    region: city
    initial_value: 0.0
    expression: external_cost_IRR_year / max(trips_per_year, 1)
  cost_road_safety_IRR_year:
    type: expression
    description: cost of road crashes from fatalities and injuries
    units: IRR/year
    category: impact
    subcategory: external_costs
    region: city
    initial_value: 0.0
    expression: acc_fatl * cost_per_fatality_IRR + acc_serious_injuries * cost_per_serious_injury_IRR
  deaths_NO2:
    type: expression
    description: number of deaths attributable to NO₂
    units: Deaths/year
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.0
    expression: population_city * mortality_adult_rate * AF_NO2
  deaths_PM25:
    type: expression
    description: number of deaths attributable to PM₂.₅
    units: Deaths/year
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.0
    expression: population_city * mortality_adult_rate * AF_PM25
  deaths_PM25_adult:
    type: expression
    description: number of deaths attributable to PM₂.₅ (adults)
    units: Deaths/year
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.0
    expression: (population_15_64 + population_65_plus) * mortality_adult_rate * AF_PM25_adult
  deaths_PM25_child:
    type: expression
    description: number of deaths attributable to PM₂.₅ (children)
    units: Deaths/year
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.0
    expression: population_0_14 * mortality_child_rate * AF_PM25_child
  deaths_total:
    type: expression
    description: number of deaths attributable to air pollution (PM2.5 + NO2)
    units: Deaths/year
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.0
    expression: deaths_PM25 + deaths_NO2
  dly_r12:
    type: expression
    description: delay share derived from congestion_index (bounded; used for time-loss valuation)
    units: Fraction
    category: transport
    subcategory: congestion
    region: region 12
    usage: derived
    initial_value: 0.0
    bounds:
    - 0.0
    - 2.0
    expression: min(max(alpha_delay_congestion_r12 * congestion_index_r12, 0.0), 2.0)
  dly_tot:
    type: expression
    description: delay share derived from congestion_index (bounded; used for time-loss valuation)
    units: Fraction
    category: transport
    subcategory: congestion
    region: city
    usage: derived
    initial_value: 0.0
    bounds:
    - 0.0
    - 2.0
    expression: min(max(alpha_delay_congestion * congestion_index, 0.0), 2.0)
  economic_value_admissions_IRR:
    type: expression
    description: cost of respiratory admissions (PM2.5; assuming 5-day average length of stay)
    units: IRR/year
    category: social
    subcategory: health_impacts
    region: city
    initial_value: 0.0
    expression: respiratory_admissions * cost_hospital_day_IRR_indexed * 5
