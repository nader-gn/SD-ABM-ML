  spd_tax_freeflow_r12:
    type: expression
    region: region 12
    category: transport
    subcategory: service_speed
    units: km/h
    description: Region 12 free-flow speed for tax (scaled from city).
    expression: spd_tax_freeflow * r12_speed_factor
    initial_value: 0.0
  spd_oth_freeflow_r12:
    type: expression
    region: region 12
    category: transport
    subcategory: service_speed
    units: km/h
    description: Region 12 free-flow speed for oth (scaled from city).
    expression: spd_oth_freeflow * r12_speed_factor
    initial_value: 0.0
  spd_mot_freeflow_r12:
    type: expression
