    expression: spd_bus_freeflow * r12_speed_factor
    initial_value: 0.0
  congestion_factor_r12_vs_city:
    type: expression
    region: region 12
    category: transport
    subcategory: congestion
    units: Dimensionless
    description: 'Congestion amplification factor: (1+CI_r12)/(1+CI_city), bounded.'
    expression: min(max((1 + congestion_index_r12) / max((1 + congestion_index), 1e-6), 0.3), 5.0)
    initial_value: 0.0
  operating_condition_factor_r12_vs_city:
    type: expression
    region: region 12
    category: transport
    subcategory: performance
    units: Dimensionless
    description: Operating-condition factor based on speed penalty (city speed / r12 speed), bounded.
    expression: min(max(spd_car / max(spd_car_r12, 1e-6), 0.5), 3.0)
    initial_value: 0.0
  traffic_condition_factor_r12_vs_city:
    type: expression
    region: region 12
    category: transport
    subcategory: performance
    units: Dimensionless
    description: Combined traffic-condition factor for r12 vs city (v/c congestion × speed penalty), bounded.
    expression: min(max(congestion_factor_r12_vs_city * operating_condition_factor_r12_vs_city, 0.3), 5.0)
    initial_value: 0.0
  vkt_pce_per_capita_city:
    type: expression
    region: city
    category: transport
    subcategory: exposure
    units: PCE-km/person-year
    description: Per-capita PCE-km (exposure proxy).
    expression: vkm_pce_total / max(population_city, 1e-6)
    initial_value: 0.0
  vkt_pce_per_capita_r12:
    type: expression
    region: region 12
    category: transport
    subcategory: exposure
    units: PCE-km/person-year
    description: Per-capita PCE-km (exposure proxy).
    expression: vkm_pce_total_r12 / max(pop_r12, 1e-6)
    initial_value: 0.0
  vkt_pc_ratio_r12_vs_city:
    type: expression
    region: region 12
    category: transport
    subcategory: exposure
    units: Dimensionless
    description: Per-capita VKT ratio (R12 vs city), bounded.
    expression: min(max(vkt_pce_per_capita_r12 / max(vkt_pce_per_capita_city, 1e-9), 0.2), 5.0)
    initial_value: 0.0
  noise_exposure_index_r12_proxy:
    type: expression
    region: region 12
    category: environment
    subcategory: noise_parameters
    units: Dimensionless
    description: Proxy for traffic-noise exposure index in Region 12 (per-capita exposure + traffic-condition amplification).
    expression: noise_exposure_index * pow(vkt_pc_ratio_r12_vs_city, 0.5) * pow(traffic_condition_factor_r12_vs_city, 0.5)
    initial_value: 0.0
    bounds:
    - 0.0
    - 10.0
  NO2_excess_city_ugm3:
    type: expression
    region: city
    category: environment
    subcategory: air_quality
    units: µg/m³
    description: Transport-attributable NO2 excess above background (city).
    expression: max(concentration_NO2_ugm3 - NO2_background_ugm3, 0.0)
    initial_value: 0.0
    bounds:
    - 0.0
    - 200.0
  NOx_per_capita_city_t_person_year:
    type: expression
    region: city
    category: environment
    subcategory: air_quality
    units: t/person-year
    description: NOx emissions per capita (city).
    expression: NOx_t_year / max(population_city, 1e-6)
    initial_value: 0.0
  NOx_per_capita_r12_t_person_year:
    type: expression
    region: region 12
    category: environment
    subcategory: air_quality
    units: t/person-year
    description: NOx emissions per capita (Region 12).
    expression: NOx_t_year_r12 / max(pop_r12, 1e-6)
    initial_value: 0.0
  NOx_pc_ratio_r12_vs_city:
    type: expression
    region: region 12
    category: environment
    subcategory: air_quality
    units: Dimensionless
    description: NOx per-capita ratio (R12 vs city), bounded.
    expression: min(max(NOx_per_capita_r12_t_person_year / max(NOx_per_capita_city_t_person_year, 1e-9), 0.2), 5.0)
    initial_value: 0.0
  NO2_multiplier_r12:
    type: expression
    region: region 12
    category: environment
    subcategory: air_quality
    units: Dimensionless
    description: Bounded multiplier for district NO2 proxy (intensity + traffic-condition + central uplift).
    expression: min(max(1.35 * pow(NOx_pc_ratio_r12_vs_city, 0.5) * pow(traffic_condition_factor_r12_vs_city, 0.5), 0.8),
      3.0)
    initial_value: 0.0
    bounds:
    - 0.0
    - 5.0
  concentration_NO2_ugm3_r12_proxy:
    type: expression
    region: region 12
    category: environment
    subcategory: air_quality
    units: µg/m³
    description: 'Proxy for NO2 concentration in Region 12: background + excess_city × bounded multiplier.'
    expression: NO2_background_ugm3 + NO2_excess_city_ugm3 * NO2_multiplier_r12
    initial_value: 0.0
    bounds:
    - 0.0
    - 250.0
  congestion_multiplier_r12:
    type: input
    description: Multiplier mapping city congestion index to Region 12 congestion index (proxy).
    units: Dimensionless
    category: transport
    subcategory: congestion
    region: region 12
    usage: calibration
    initial_value: 3.04882125
    bounds:
    - 0.5
    - 5.0
  PT_expenditure_total_IRR_year:
    type: expression
    description: Total public transport expenditure (bus+metro) = per-person × population
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: city
    initial_value: 0.0
    expression: PT_expenditure_per_person_IRR_year * population_city
    dependencies:
    - PT_expenditure_per_person_IRR_year
    - population_city
  fare_revenue_PT_total_IRR_year:
    type: expression
    description: Total fare revenue (bus+metro)
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: city
    initial_value: 0.0
    expression: fare_revenue_bus_IRR_year + fare_revenue_metro_IRR_year
    dependencies:
    - fare_revenue_bus_IRR_year
    - fare_revenue_metro_IRR_year
  PT_subsidy_need_IRR_year:
    type: expression
    description: Required PT subsidy = expenditure - fare revenue (>=0)
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: city
    initial_value: 0.0
    expression: max(OPEX_PT_IRR_year - fare_revenue_PT_total_IRR_year, 0)
    dependencies:
    - OPEX_PT_IRR_year
    - fare_revenue_PT_total_IRR_year
  transport_budget_utilization:
    type: expression
    description: PT subsidy need / transport budget (dimensionless)
    units: –
    category: economic
    subcategory: public_transport_finance
    region: city
    initial_value: 0.0
    expression: PT_subsidy_need_IRR_year / max(transport_budget_effective_IRR_year, 1e-9)
    dependencies:
    - PT_subsidy_need_IRR_year
    - transport_budget_effective_IRR_year
  transport_budget_gap_IRR_year:
    type: expression
    description: Budget gap = PT subsidy need - transport budget (positive means shortfall)
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: city
    initial_value: 0.0
    expression: PT_subsidy_need_IRR_year - transport_budget_effective_IRR_year
    dependencies:
    - PT_subsidy_need_IRR_year
    - transport_budget_effective_IRR_year
  PT_expenditure_total_IRR_year_r12_alloc:
    type: expression
    description: Allocated PT expenditure to Region 12 by PT trips share
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: PT_expenditure_total_IRR_year * (PT_trips_total_r12 / max(PT_trips_total,1e-9))
    dependencies:
    - PT_expenditure_total_IRR_year
    - PT_trips_total_r12
    - PT_trips_total
  fare_revenue_PT_total_IRR_year_r12_alloc:
    type: expression
    description: Allocated PT fare revenue to Region 12 by PT trips share
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: fare_revenue_PT_total_IRR_year * (PT_trips_total_r12 / max(PT_trips_total,1e-9))
    dependencies:
    - fare_revenue_PT_total_IRR_year
    - PT_trips_total_r12
    - PT_trips_total
  PT_subsidy_need_IRR_year_r12_alloc:
    type: expression
    description: Allocated PT subsidy need to Region 12 by PT trips share
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: max(OPEX_PT_IRR_year_r12_alloc - revenue_transport_public_IRR_year_r12_alloc, 0)
    dependencies:
    - OPEX_PT_IRR_year_r12_alloc
    - revenue_transport_public_IRR_year_r12_alloc
  transport_budget_utilization_r12_alloc:
    type: expression
    description: Allocated utilization = allocated subsidy need / allocated transport budget
    units: –
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: PT_subsidy_need_IRR_year_r12_alloc / max(transport_budget_effective_IRR_year_r12_alloc, 1e-9)
    dependencies:
    - PT_subsidy_need_IRR_year_r12_alloc
    - transport_budget_effective_IRR_year_r12_alloc
  transport_budget_gap_IRR_year_r12_alloc:
    type: expression
    description: Allocated budget gap = allocated subsidy need - allocated budget
    units: IRR/year
    category: economic
    subcategory: public_transport_finance
    region: region 12
    initial_value: 0.0
    expression: PT_subsidy_need_IRR_year_r12_alloc - transport_budget_effective_IRR_year_r12_alloc
    dependencies:
    - PT_subsidy_need_IRR_year_r12_alloc
    - transport_budget_effective_IRR_year_r12_alloc
  bus_fare_rate_base:
