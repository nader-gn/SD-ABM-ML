    description: number of trips by bus
    units: Trips/year
    category: transport
    subcategory: travel_demand
    region: city
    initial_value: 0.0
    expression: trips_per_year * modal_share_bus
  trips_car:
    type: expression
    description: number of trips by car
    units: Trips/year
    category: transport
    subcategory: travel_demand
    region: city
    initial_value: 0.0
    expression: trips_per_year * modal_share_car
  trips_metro:
    type: expression
    description: number of trips by metro
    units: Trips/year
    category: transport
    subcategory: travel_demand
    region: city
    initial_value: 0.0
    expression: trips_per_year * modal_share_metro
  trips_motorcycle:
    type: expression
    description: number of trips by motorcycle
    units: Trips/year
    category: transport
    subcategory: travel_demand
    region: city
    initial_value: 0.0
