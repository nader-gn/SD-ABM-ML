  pkm_car:
    type: expression
    description: distance of passenger travel by car
    units: Passenger-km/year
    category: transport
    subcategory: traffic_activity_city
    region: city
    initial_value: 0.0
    expression: trips_car * trip_length_km
  pkm_taxi:
    type: expression
    description: distance of passenger travel by taxi
    units: Passenger-km/year
    category: transport
    subcategory: traffic_activity_city
    region: city
    initial_value: 0.0
    expression: trips_taxi * trip_length_km
  pkm_bus:
