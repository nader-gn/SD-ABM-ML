    category: transport
    subcategory: service_speed
    units: km/h
    description: Region 12 free-flow speed for mot (scaled from city).
    expression: spd_mot_freeflow * r12_speed_factor
    initial_value: 0.0
  spd_bus_freeflow_r12:
    type: expression
