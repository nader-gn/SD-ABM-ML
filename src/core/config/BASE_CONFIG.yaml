  share_vkm_motorized_r12_city:
    type: expression
    description: share of motorized VKT (city to region 12) for spatial downscaling
    units: Fraction
    category: transport
    subcategory: traffic_activity_region
    region: region 12
    usage: derived
    initial_value: 0.0
    expression: vkm_motorized_r12 / max(vkm_motorized_city, 1.0)
  cost_of_carbon_IRR_t:
    type: input
    description: cost of carbon per tonne of CO₂
    units: IRR/tCO2
    category: environment
    subcategory: climate_co2
    region: city
    initial_value: 15000000.0
  alpha_congestion_speed:
    type: input
    description: sensitivity of speeds to congestion level
    units: Dimensionless
    category: transport
    subcategory: congestion_capacity
    region: city
    initial_value: 1.0
  alpha_delay_congestion:
    type: input
    description: City delay-response coefficient mapping congestion_index to modeled delay share; retained at the deployed value because it has zero sensitivity in the declared historical recovery objective.
    units: Dimensionless
    category: transport
    subcategory: congestion
    region: city
    usage: calibration
    initial_value: 1.0
    bounds:
    - 0.0
    - 5.0
  congestion_index:
    type: expression
    description: index of congestion intensity (0 when v/c<=1 and positive when demand exceeds capacity)
    units: Dimensionless
    category: transport
    subcategory: congestion_capacity
    region: city
    initial_value: 0.0
    expression: min(max(0.52924048 * pow(max(v_over_c, 0.0), 1.0), 0.0), 5.0)
  alpha_delay_congestion_r12:
    type: input
    description: Region 12 delay-response coefficient mapping congestion_index_r12 to modeled delay share; treated as a free scalar in the local historical recovery audit.
    units: Dimensionless
    category: transport
    subcategory: congestion
    region: region 12
    usage: calibration
    initial_value: 1.0
    bounds:
    - 0.0
    - 5.0
  congestion_index_r12:
    type: expression
    description: Congestion index in Region 12 as a proxy scaled from city congestion index.
    units: Dimensionless
    category: transport
    subcategory: congestion
    region: region 12
    dependencies:
    - congestion_index
    - congestion_multiplier_r12
    expression: min(max(congestion_index * congestion_multiplier_r12, 0.0), 5.0)
    bounds:
    - 0.0
    - 10.0
  spd_mot:
    type: expression
    description: speed of motorcycles (under congestion)
    units: km/h
    category: transport
    subcategory: service_speed
    region: city
    initial_value: 0.0
    expression: spd_mot_history_calibration_factor * spd_mot_freeflow / (1.0 + 0.7 * alpha_congestion_speed * congestion_index)
    dependencies:
    - spd_mot_history_calibration_factor
    - spd_mot_freeflow
    - alpha_congestion_speed
    - congestion_index
  spd_mot_freeflow:
    type: input
    description: speed of motorcycles (under free-flow)
    units: km/h
    category: transport
    subcategory: service_speed
    region: city
    initial_value: 36.52073084
  spd_car:
    type: expression
    description: speed of cars (under congestion)
    units: km/h
    category: transport
    subcategory: service_speed
    region: city
    initial_value: 0.0
    expression: (spd_car_history_calibration_factor * spd_car_city_calibration_factor * spd_car_freeflow) / (1.0 + alpha_congestion_speed
      * congestion_index)
  spd_car_freeflow:
    type: input
    description: speed of cars (under free-flow)
    units: km/h
    category: transport
    subcategory: service_speed
    region: city
    initial_value: 36.18237522
  spd_car_city_calibration_factor:
    type: input
    description: Multiplicative calibration factor applied only to Tehran car speed to align modeled citywide car speed and
      travel time with observed values without disturbing Region 12 calibration.
    units: Dimensionless
    category: transport
    subcategory: calibration
    region: city
    usage: calibration
    initial_value: 1.0
    bounds:
    - 0.5
    - 2.0
  spd_tax:
    type: expression
    description: speed of taxis (under congestion)
    units: km/h
    category: transport
    subcategory: service_speed
    region: city
    initial_value: 0.0
    expression: spd_tax_freeflow / (1.0 + alpha_congestion_speed * congestion_index)
  spd_tax_freeflow:
    type: input
    description: speed of taxis (under free-flow)
    units: km/h
    category: transport
    subcategory: service_speed
    region: city
    initial_value: 33.45811017
  spd_bus:
    type: expression
    description: speed of buses (under congestion)
    units: km/h
    category: transport
    subcategory: service_speed
    region: city
    initial_value: 0.0
    expression: (spd_bus_history_calibration_factor * spd_bus_freeflow) / (1.0 + 1.2 * alpha_congestion_speed * congestion_index)
  spd_bus_freeflow:
    type: input
    description: speed of buses (under free-flow)
    units: km/h
    category: transport
    subcategory: service_speed
    region: city
    initial_value: 30.64943544
  spd_met:
    type: input
    description: metro speed (observed historical service-speed regime; baseline projection held via forecast lock)
    units: km/h
    category: transport
    subcategory: service_speed
    region: city
    initial_value: 23.0777
    column: spd_met_histcal
  spd_oth:
    type: expression
    description: speed of other motorized modes (under congestion)
    units: km/h
    category: transport
    subcategory: service_speed
    region: city
    initial_value: 0.0
    expression: spd_oth_freeflow / (1.0 + alpha_congestion_speed * congestion_index)
  spd_oth_freeflow:
    type: input
    description: speed of other motorized modes (under free-flow)
    units: km/h
    category: transport
    subcategory: service_speed
    region: city
    initial_value: 30.70278802
  time_loss_car_hours_year:
    type: expression
    description: annual time loss for car users due to congestion (delay share applied to car travel time)
    units: hour/year
    category: transport
    subcategory: congestion
    region: city
    usage: derived
    initial_value: 0.0
    expression: trips_car * travel_time_car_hours * dly_tot
  time_loss_car_hours_year_r12:
    type: expression
    description: Annual car time loss in Region 12 due to congestion (delay share applied to baseline car travel time in R12).
    units: hour/year
    category: transport
    subcategory: region12_performance
    region: region 12
    usage: derived
    initial_value: 0.0
    expression: trp_r12 * modal_share_car_r12 * travel_time_car_r12_base_hours * dly_r12
    dependencies:
    - trp_r12
    - modal_share_car_r12
    - travel_time_car_r12_base_hours
    - dly_r12
  traffic_plan_fee_IRR_trip:
    type: expression
    description: traffic_plan_fee_IRR_trip (effective = traffic_plan_fee_IRR_trip_base × traffic_plan_fee_multiplier)
    units: IRR/trip
    category: economic
    subcategory: policy_revenue
    region: region 12
    subregion: traffic-plan area
    usage: data
    initial_value: 0.0
    expression: traffic_plan_fee_IRR_trip_base * traffic_plan_fee_multiplier
    dependencies:
    - traffic_plan_fee_IRR_trip_base
    - traffic_plan_fee_multiplier
  transport_financial_balance_IRR:
    type: stock
    description: cumulative financial balance of public transport (revenues minus costs integrated over time)
    units: IRR
    category: economic
    subcategory: macro
    region: city
    initial_value: 0.0
    inflows:
    - revenue_transport_public_IRR_year
    outflows:
    - cost_transport_public_IRR_year
  cost_transport_public_IRR_year:
    type: expression
    description: cost of public transport (OPEX plus affordable CAPEX)
    units: IRR/year
    category: economic
    subcategory: macro
    region: city
    initial_value: 0.0
    expression: OPEX_PT_IRR_year + CAPEX_transport_affordable_IRR_year
  system_cost_transport_IRR_year:
    type: expression
    description: cost of the transport system
    units: IRR/year
    category: impact
    subcategory: system_costs
    region: city
    initial_value: 0.0
    expression: CAPEX_transport_IRR_year + OPEX_transport_IRR_year + cost_energy_IRR_year + cost_health_IRR_year + cost_road_safety_IRR_year
      + cost_climate_IRR_year
  system_cost_per_pkm_IRR:
    type: expression
    description: cost of externalities per passenger-km (total)
    units: IRR/pkm
    category: impact
    subcategory: system_costs
    region: city
    initial_value: 0.0
